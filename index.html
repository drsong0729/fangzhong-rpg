<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="房仲菜鳥大冒險 — 8-bit 房仲養成 RPG">
<style>html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>房仲菜鳥大冒險</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=LXGW+WenKai+TC:wght@400;700&family=Press+Start+2P&display=swap">
<style>
/* ── 房仲菜鳥大冒險 ─────────────────────────────────────
   單一視覺世界：夜色街廓 + 招牌燈箱。版面固定一屏、不捲動。 */
:root{
  --ink:#0b1017; --ink2:#121a25; --panel:#18222f; --panel2:#1f2c3c;
  --line:#33455c; --line2:#4b6280; --cream:#f3ead9; --dim:#94a5bb; --dimmer:#63758d;
  --amber:#f6b23c; --amber-d:#c4831f; --red:#e2564a; --jade:#54b98d; --violet:#8a79e0;
  --f-disp:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-body:"LXGW WenKai TC","Noto Sans TC","PingFang TC",sans-serif;
  --f-mono:"Press Start 2P","Noto Sans TC",monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--ink);color:var(--cream);font-family:var(--f-disp);
  -webkit-font-smoothing:antialiased;overflow:hidden;
  background-image:
    radial-gradient(120% 80% at 50% -10%,#1b2a3d 0%,rgba(11,16,23,0) 60%),
    repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0 1px,transparent 1px 3px);
}
button{font-family:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}

.wrap{height:100dvh;max-width:1120px;margin:0 auto;
  padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;gap:7px;overflow:hidden}

/* ── 抬頭列 ── */
.hud{flex:none;display:flex;gap:8px 16px;align-items:center;flex-wrap:wrap;
  padding:7px 10px;background:linear-gradient(180deg,var(--panel2),var(--panel));
  border:2px solid var(--line);border-radius:4px}
.hud.hidden{display:none}
.stat{display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-family:var(--f-mono);font-size:8px;letter-spacing:.08em;color:var(--dimmer);font-weight:400}
.stat s{text-decoration:none;font-size:15px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.1}
.bar{width:104px;height:8px;background:#0a0f16;border:2px solid var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--amber);transition:width .25s steps(8)}
.bar.rap i{background:var(--jade)} .bar.guard i{background:var(--red)}
.pips{display:flex;gap:3px;align-items:center}
.pip{width:11px;height:15px;background:#0a0f16;border:2px solid var(--line);border-radius:1px}
.pip.on{background:var(--jade);border-color:#8fe0bb;box-shadow:0 0 5px rgba(84,185,141,.55)}
.hud-r{display:flex;gap:5px;margin-left:auto;flex-wrap:wrap}
.mini{font-family:var(--f-mono);font-size:7.5px;letter-spacing:.05em;background:var(--panel2);
  border:2px solid var(--line);color:var(--dim);padding:6px 7px;border-radius:3px;cursor:pointer;line-height:1.3}
.mini:hover{border-color:var(--line2);color:var(--cream)}
.mini.on{color:var(--amber);border-color:var(--amber-d)}

/* ── 舞台（由 JS 依可用空間定尺寸，永遠不捲動） ── */
.stagewrap{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center}
.stage{position:relative;background:#9fb0b6;border:3px solid var(--line);border-radius:5px;
  overflow:hidden;box-shadow:0 0 0 1px #000,0 14px 40px -16px rgba(0,0,0,.9);touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;display:block}
.scan{position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.10) 0 2px,transparent 2px 4px);
  mix-blend-mode:multiply;opacity:.35}
.vig{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(125% 100% at 50% 42%,transparent 62%,rgba(20,26,32,.30) 100%)}

/* ── 標題畫面 ── */
.title-lyr{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:calc(var(--u)*.022) 12px;
  overflow:hidden;
  /* --u：同時受舞台寬與高限制的縮放基準，矮畫面會整體縮小而不是被切掉 */
  --u:min(var(--sw,480px),calc(var(--sh,320px) * 1.42));
  background:linear-gradient(180deg,rgba(6,10,15,.35),rgba(6,10,15,.82))}
.tt-sub{font-family:var(--f-mono);font-size:clamp(7px,calc(var(--u)*.0165),11px);
  letter-spacing:.24em;color:var(--amber);margin-bottom:calc(var(--u)*.024);text-shadow:0 2px 0 #000}
.tt{font-family:var(--f-disp);font-weight:900;letter-spacing:.05em;
  font-size:clamp(22px,calc(var(--u)*.104),68px);line-height:1.06;margin:0;
  max-width:100%;text-align:center;color:var(--cream);
  text-shadow:3px 0 0 #000,-3px 0 0 #000,0 3px 0 #000,0 -3px 0 #000,
    3px 3px 0 #000,-3px 3px 0 #000,3px -3px 0 #000,-3px -3px 0 #000,
    0 7px 0 var(--amber-d),0 9px 0 #000,0 16px 26px rgba(0,0,0,.7)}
.tt em{font-style:normal;color:var(--amber)}
.tt-rule{width:calc(var(--u)*.72);max-width:460px;height:3px;flex:none;
  margin:calc(var(--u)*.028) 0 calc(var(--u)*.026);
  background:linear-gradient(90deg,transparent,var(--line2) 18%,var(--amber) 50%,var(--line2) 82%,transparent)}
.menu{display:flex;flex-direction:column;gap:calc(var(--u)*.018);width:min(78%,calc(var(--u)*.62));max-width:330px}
.mbtn{font-family:var(--f-disp);font-weight:700;letter-spacing:.12em;
  font-size:clamp(13px,calc(var(--u)*.043),21px);
  padding:calc(var(--u)*.021) 12px;background:var(--panel);color:var(--cream);border:2px solid var(--line2);
  border-radius:3px;cursor:pointer;text-align:center;box-shadow:0 4px 0 0 #060a0f;
  transition:transform .06s steps(2),background .12s}
.mbtn:hover:not(:disabled){background:var(--panel2);border-color:var(--amber-d);color:var(--amber)}
.mbtn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 0 #060a0f}
.mbtn:disabled{opacity:.32;cursor:not-allowed;filter:grayscale(1)}
.mbtn small{display:block;font-family:var(--f-mono);letter-spacing:.09em;
  font-size:clamp(6px,calc(var(--u)*.0155),9.5px);color:var(--dimmer);margin-top:4px;font-weight:400}
.tt-foot{flex:none;margin-top:calc(var(--u)*.034);max-width:96%;text-align:center;line-height:1.7;
  font-family:var(--f-mono);font-size:clamp(6px,calc(var(--u)*.0145),9px);
  letter-spacing:.1em;color:var(--dimmer)}
.tt-sub,.tt,.tt-foot{flex:none}

/* ── 覆蓋面板 ── */
.ovl{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;
  background:rgba(5,8,12,.92);backdrop-filter:blur(3px);padding:12px;overflow:auto;overscroll-behavior:contain}
.ovl.show{display:flex}
#ovlInner{width:100%;display:flex;flex-direction:column;margin:auto}
.card{width:100%;max-width:620px;margin:0 auto;background:var(--panel);border:2px solid var(--line2);
  border-radius:4px;box-shadow:0 8px 0 -4px #060a0f,0 22px 46px -20px #000}
.card-hd{display:flex;align-items:center;gap:8px;padding:8px 11px;
  background:linear-gradient(180deg,var(--panel2),var(--panel));border-bottom:2px solid var(--line)}
.card-hd h3{margin:0;font-size:13px;font-weight:900;letter-spacing:.09em}
.card-hd .tag{margin-left:auto;font-family:var(--f-mono);font-size:6.5px;letter-spacing:.08em;
  color:var(--ink);background:var(--amber);padding:4px 6px;border-radius:2px}
.card-bd{padding:11px}

/* 謄本 */
.deed{background:#f3ead9;color:#1b2330;border:2px solid #0a0f16;border-radius:2px;padding:11px 12px;
  font-family:var(--f-body);line-height:1.55;box-shadow:inset 0 0 0 1px #cbbfa6}
.deed-t{display:flex;align-items:baseline;gap:8px;border-bottom:2px solid #1b2330;padding-bottom:6px;margin-bottom:9px}
.deed-t b{font-family:var(--f-disp);font-weight:900;font-size:14px;letter-spacing:.14em}
.deed-t span{margin-left:auto;font-size:9.5px;color:#6c6250}
.deed h4{margin:10px 0 5px;font-size:11px;font-weight:900;letter-spacing:.18em;color:#8a5a11;
  border-left:4px solid #c4831f;padding-left:6px}
.deed h4:first-of-type{margin-top:0}
.deed dl{display:grid;grid-template-columns:auto 1fr;gap:3px 11px;margin:0;font-size:13px}
.deed dt{color:#6c6250;white-space:nowrap;font-family:var(--f-disp);font-size:11.5px;padding-top:2px}
.deed dd{margin:0;font-weight:700;word-break:break-all}
.deed .big{font-size:15px;color:#8a2f22}
.deed .mask{letter-spacing:.16em;color:#8a2f22}
.deed-note{margin-top:9px;padding-top:7px;border-top:1px dashed #b3a68c;font-size:11px;color:#6c6250;font-family:var(--f-disp)}

/* 對話框 */
.talkbox{position:absolute;left:8px;right:8px;bottom:8px;z-index:6;display:none;
  background:var(--panel);border:2px solid var(--line2);border-radius:4px;
  box-shadow:0 6px 0 -2px #060a0f,0 18px 34px -14px #000}
.talkbox.show{display:block}
.talk-who{display:flex;align-items:center;gap:7px;padding:5px 10px;border-bottom:2px solid var(--line);background:var(--panel2)}
.talk-who b{font-size:12px;font-weight:900;letter-spacing:.08em;color:var(--amber)}
.talk-who i{font-style:normal;font-family:var(--f-mono);font-size:6.5px;color:var(--dimmer)}
.talk-tx{padding:9px 12px 11px;font-family:var(--f-body);font-size:clamp(13px,2.6vmin,16px);line-height:1.66;min-height:3.2em}
.talk-tx .nar{color:var(--dim)}
.talk-next{position:absolute;right:10px;bottom:6px;font-family:var(--f-mono);font-size:6.5px;
  color:var(--amber);animation:blink 1s steps(2,jump-none) infinite}
@keyframes blink{50%{opacity:0}}

/* 選項 */
.choices{display:flex;flex-direction:column;gap:6px;margin-top:9px}
.ch{display:flex;gap:8px;align-items:flex-start;text-align:left;width:100%;
  background:var(--panel2);border:2px solid var(--line);border-radius:3px;padding:9px 11px;
  cursor:pointer;font-family:var(--f-body);font-size:13.8px;line-height:1.55;
  transition:border-color .12s,background .12s,transform .06s steps(2)}
.ch:hover:not(:disabled){border-color:var(--amber-d);background:#26364a}
.ch:active:not(:disabled){transform:translateY(2px)}
.ch:disabled{opacity:.38;cursor:not-allowed}
.choices.tight{gap:5px;margin-top:8px}
.choices.tight .ch{padding:7px 9px;font-size:12.5px;line-height:1.6}
.orline{display:flex;align-items:center;gap:8px;margin:9px 0 4px;
  font-family:var(--f-mono);font-size:7.5px;letter-spacing:.14em;color:var(--dimmer)}
.orline::before,.orline::after{content:'';flex:1;height:2px;background:var(--line)}
.ch .k{font-family:var(--f-mono);font-size:8.5px;color:var(--amber);padding-top:3px;flex:none}
.ch small{display:block;font-size:11px;color:var(--dimmer);font-family:var(--f-mono);letter-spacing:.04em;margin-top:4px}

/* 戰鬥 */
.duel{display:flex;flex-direction:column;gap:8px}
.duel-top{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gauge{background:var(--panel2);border:2px solid var(--line);border-radius:3px;padding:7px 9px}
.gauge b{display:block;font-family:var(--f-mono);font-size:7.5px;letter-spacing:.06em;color:var(--dimmer);margin-bottom:5px}
.gauge .bar{width:100%}
.gauge u{text-decoration:none;display:block;margin-top:4px;font-size:10.5px;color:var(--dim)}
.say{background:#0e1620;border:2px solid var(--line);border-left:5px solid var(--red);border-radius:3px;
  padding:9px 11px;font-family:var(--f-body);font-size:14.5px;line-height:1.65}
.say.me{border-left-color:var(--jade)}
.say.nar{border-left-color:var(--line2);color:var(--dim);font-size:13.5px}
.say b{color:var(--amber);font-family:var(--f-disp);font-size:11.5px;letter-spacing:.08em;display:block;margin-bottom:4px}
.freeform{display:flex;gap:6px;margin-top:7px}
.freeform input{flex:1;min-width:0;background:#0e1620;border:2px solid var(--violet);border-radius:3px;
  color:var(--cream);padding:9px 10px;font-family:var(--f-body);font-size:14px}
.freeform input::placeholder{color:var(--dimmer)}
.freeform button{background:var(--violet);border:2px solid #a596f0;color:#0e0b1c;font-weight:900;
  border-radius:3px;padding:0 15px;cursor:pointer;font-size:13px;letter-spacing:.06em;white-space:nowrap}
.freeform button:disabled{opacity:.4;cursor:not-allowed}
.thinking{font-family:var(--f-mono);font-size:7.5px;color:var(--violet);letter-spacing:.08em;margin-top:6px;line-height:1.7}

/* 自由輸入 */
.ffwrap{display:flex;gap:7px;align-items:stretch;margin-top:2px}
.ffwrap textarea{flex:1;min-width:0;resize:none;background:#0e1620;border:2px solid var(--violet);
  border-radius:3px;color:var(--cream);padding:9px 11px;font-family:var(--f-body);
  font-size:14.5px;line-height:1.55}
.ffwrap textarea::placeholder{color:var(--dimmer)}
.ffwrap textarea:disabled{opacity:.55}
.ffgo{flex:none;background:var(--violet);border:2px solid #a596f0;color:#0e0b1c;font-weight:900;
  border-radius:3px;padding:0 15px;cursor:pointer;font-size:13.5px;letter-spacing:.06em;white-space:nowrap}
.ffgo:disabled{opacity:.4;cursor:wait}
.coach{font-size:12px;line-height:1.75;color:var(--dim);font-family:var(--f-body);
  background:#0e1620;border:2px solid var(--line);border-left:5px solid var(--violet);
  border-radius:3px;padding:8px 10px}
.coach .cl{display:inline-block;font-family:var(--f-mono);font-size:7px;letter-spacing:.08em;
  background:var(--violet);color:#0e0b1c;padding:3px 5px;border-radius:2px;margin-right:6px;
  vertical-align:1px}
.coach .cl.tipc{background:var(--amber);color:#22190a}
.coach .cl.warn{background:var(--red);color:#fff}
.coach.think{border-left-color:var(--amber);color:var(--amber);font-family:var(--f-mono);font-size:8.5px;letter-spacing:.08em}
.coach.warn{border-left-color:var(--red);color:var(--red)}

/* 排行榜 */
.board{border:2px solid var(--line);border-radius:3px;overflow:hidden;max-height:52vh;overflow-y:auto}
.bhd,.brow{display:grid;grid-template-columns:44px 1fr 74px 62px;align-items:center;gap:6px;padding:8px 10px}
.bhd{background:var(--panel2);font-family:var(--f-mono);font-size:7.5px;letter-spacing:.08em;
  color:var(--dimmer);position:sticky;top:0}
.brow{border-top:1px solid var(--line);font-size:13.5px}
.brow:nth-child(even){background:rgba(255,255,255,.02)}
.brow.mine{background:rgba(246,178,60,.09)}
.brow .rk{font-family:var(--f-mono);font-size:11px;color:var(--dimmer);text-align:center}
.brow:nth-child(2) .rk,.brow:nth-child(3) .rk,.brow:nth-child(4) .rk{font-size:15px}
.brow .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .dy{font-family:var(--f-mono);font-size:12px;color:var(--amber);font-variant-numeric:tabular-nums}
.brow .sg{font-family:var(--f-mono);font-size:10px;color:var(--jade)}

/* 行動列 */
.acts{flex:none;display:flex;gap:7px;align-items:center;overflow-x:auto;overflow-y:hidden;
  padding-bottom:2px;scrollbar-width:thin}
.act{flex:none;display:flex;align-items:center;gap:7px;background:var(--panel);border:2px solid var(--line2);
  border-radius:3px;padding:8px 12px;cursor:pointer;font-weight:700;font-size:13px;letter-spacing:.05em;
  box-shadow:0 3px 0 0 #060a0f;transition:transform .06s steps(2);white-space:nowrap}
.act:hover:not(:disabled){border-color:var(--amber-d);color:var(--amber)}
.act:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 0 #060a0f}
.act:disabled{opacity:.35;cursor:not-allowed;filter:grayscale(1)}
.act .ap{font-family:var(--f-mono);font-size:7.5px;color:var(--amber)}
.act.gold{background:var(--amber);color:#22190a;border-color:#ffd889}
.act.gold .ap{color:#6b4c08}
.hint{flex:none;font-family:var(--f-mono);font-size:7.5px;color:var(--dimmer);letter-spacing:.08em;
  line-height:1.7;white-space:nowrap;padding-left:4px}

/* 方向鍵 */
.pad{position:absolute;left:8px;bottom:8px;z-index:7;display:none;
  grid-template-columns:repeat(3,clamp(38px,calc(var(--sw,480px)*.135),52px));
  grid-template-rows:repeat(3,clamp(38px,calc(var(--sw,480px)*.135),52px));
  gap:4px;opacity:.62;transition:opacity .15s}
.pad.show{display:grid}
.pad button{background:var(--panel2);border:2px solid var(--line2);border-radius:4px;color:var(--cream);
  font-size:14px;line-height:1;cursor:pointer;-webkit-user-select:none;user-select:none}
.pad button:active{background:var(--amber);color:#22190a}
.pad .sp{visibility:hidden}

/* 紀錄清單 */
.rows{display:flex;flex-direction:column;gap:6px;max-height:56vh;overflow:auto}
.row{display:flex;gap:9px;align-items:center;background:var(--panel2);border:2px solid var(--line);
  border-radius:3px;padding:8px 10px;font-size:13px}
.row .meta{flex:1;min-width:0}
.row .a{font-weight:700;font-size:13.5px;word-break:break-all}
.row .b{font-family:var(--f-mono);font-size:8px;color:var(--dimmer);letter-spacing:.05em;margin-top:4px}
.row .st{font-family:var(--f-mono);font-size:7.5px;padding:4px 6px;border-radius:2px;flex:none;
  background:#0e1620;border:1px solid var(--line2);color:var(--dim)}
.row .st.ok{color:#0d2b1f;background:var(--jade);border-color:#8fe0bb}
.row .st.no{color:var(--red);border-color:var(--red)}
.row .go{flex:none;background:var(--panel);border:2px solid var(--line2);border-radius:3px;
  padding:7px 9px;font-size:12px;cursor:pointer;font-weight:700}
.row .go:hover:not(:disabled){border-color:var(--amber-d);color:var(--amber)}
.row .go:disabled{opacity:.34;cursor:not-allowed}
.empty{color:var(--dimmer);font-family:var(--f-body);font-size:14px;text-align:center;padding:24px 0}
.logbox{max-height:56vh;overflow:auto;font-size:13px;line-height:1.75;color:var(--dim);font-family:var(--f-body)}
.logbox b{color:var(--amber);font-family:var(--f-mono);font-size:8px;letter-spacing:.06em;margin-right:7px}
.logbox .l-good{color:var(--jade)} .logbox .l-bad{color:var(--red)}

/* 結算 */
.ending{max-width:540px;margin:auto;text-align:center;padding:10px}
.ending .verdict{font-size:clamp(22px,5.4vmin,38px);font-weight:900;letter-spacing:.13em;margin:0 0 5px;
  text-shadow:0 3px 0 #000,0 6px 0 var(--amber-d)}
.ending .verdict.bad{text-shadow:0 3px 0 #000,0 6px 0 #7d2b22}
.ending .score{font-family:var(--f-mono);font-size:9px;color:var(--dim);letter-spacing:.1em;line-height:2;margin-bottom:14px}
.ending .lines{border-top:2px solid var(--line);border-bottom:2px solid var(--line);padding:14px 6px;margin-bottom:13px}
.ending .lines p{margin:0 0 7px;font-family:var(--f-body);font-size:clamp(14px,2.9vmin,17px);line-height:1.65;opacity:0}
.ending .lines p.in{animation:rise .5s steps(6) forwards}
.ending .lines p.hi{color:var(--amber);font-weight:700;font-family:var(--f-disp);letter-spacing:.05em}
.ending .lines p.tel{font-family:var(--f-mono);font-size:13px;letter-spacing:.08em;color:var(--jade)}
@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}

.namefield{width:100%;background:#0e1620;border:2px solid var(--line2);border-radius:3px;color:var(--cream);
  padding:11px 12px;font-family:var(--f-disp);font-size:18px;font-weight:700;letter-spacing:.12em;text-align:center}

/* ═══════════════════════════════════════════════════════════
   房仲菜鳥大冒險 — 核心：亂數、音訊、資料表
   ═══════════════════════════════════════════════════════════ */
'use strict';

/* ── 亂數 ────────────────────────────────────────────────── */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function rngFor(seed,tag){return mulberry32(hashStr(seed+'|'+tag))}
function pick(r,a){return a[Math.floor(r()*a.length)]}
function ri(r,a,b){return a+Math.floor(r()*(b-a+1))}
function shuffled(r,a){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}

/* ── 音訊：合成 8-bit BGM 與音效 ───────────────────────────── */
const NOTE_BASE={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
function nf(n){ // 'A#4' → Hz
  if(!n) return 0;
  const m=/^([A-G])(#|b)?(-?\d)$/.exec(n); if(!m) return 0;
  let s=NOTE_BASE[m[1]]+(m[2]==='#'?1:m[2]==='b'?-1:0)+(+m[3]+1)*12;
  return 440*Math.pow(2,(s-69)/12);
}
const A={
  ctx:null,master:null,mg:null,sg:null,on:true,
  track:null,step:0,next:0,timer:null,noiseBuf:null,
  boot(){
    if(this.ctx) return;
    const C=window.AudioContext||window.webkitAudioContext; if(!C) return;
    this.ctx=new C();
    this.master=this.ctx.createGain(); this.master.gain.value=.9; this.master.connect(this.ctx.destination);
    this.mg=this.ctx.createGain(); this.mg.gain.value=.30; this.mg.connect(this.master);
    this.sg=this.ctx.createGain(); this.sg.gain.value=.52; this.sg.connect(this.master);
    const len=this.ctx.sampleRate*1.2, b=this.ctx.createBuffer(1,len,this.ctx.sampleRate), d=b.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
    this.noiseBuf=b;
  },
  resume(){ this.boot(); if(this.ctx&&this.ctx.state==='suspended') this.ctx.resume(); },
  tone(dst,f,t,dur,type,vol,slide){
    if(!this.ctx||!f) return;
    const o=this.ctx.createOscillator(), g=this.ctx.createGain();
    o.type=type||'square'; o.frequency.setValueAtTime(f,t);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),t+dur);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(Math.max(.0002,vol),t+.008);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g); g.connect(dst); o.start(t); o.stop(t+dur+.02);
  },
  noise(dst,t,dur,vol,freq,q){
    if(!this.ctx) return;
    const s=this.ctx.createBufferSource(); s.buffer=this.noiseBuf;
    const f=this.ctx.createBiquadFilter(); f.type='bandpass'; f.frequency.value=freq||1400; f.Q.value=q||1.1;
    const g=this.ctx.createGain();
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    s.connect(f); f.connect(g); g.connect(dst); s.start(t); s.stop(t+dur+.02);
  },
  /* ── 音效 ── */
  sfx(name){
    if(!this.on) return; this.boot(); if(!this.ctx) return;
    if(this.ctx.state==='suspended') this.ctx.resume();
    const t=this.ctx.currentTime, D=this.sg;
    switch(name){
      case 'hover': this.tone(D,880,t,.03,'square',.05); break;
      case 'click': this.tone(D,520,t,.05,'square',.16); this.tone(D,780,t+.045,.07,'square',.12); break;
      case 'confirm': [660,880,1320].forEach((f,i)=>this.tone(D,f,t+i*.055,.1,'square',.16)); break;
      case 'cancel': this.tone(D,420,t,.07,'square',.14); this.tone(D,260,t+.06,.13,'square',.12); break;
      case 'step': this.noise(D,t,.035,.06,760,2.2); break;
      case 'door': this.tone(D,150,t,.22,'triangle',.2,.5); this.noise(D,t,.14,.1,420,1.4); break;
      case 'paper': this.noise(D,t,.09,.15,2600,.8); this.noise(D,t+.1,.12,.11,1900,.8); this.noise(D,t+.24,.09,.08,3000,.9); break;
      case 'stamp': this.noise(D,t,.05,.3,700,1.2); this.tone(D,180,t,.13,'square',.2,.4); break;
      case 'phone': for(let k=0;k<2;k++){for(let i=0;i<8;i++){this.tone(D,i%2?1180:940,t+k*.62+i*.055,.05,'square',.13)}} break;
      case 'hit': this.noise(D,t,.1,.26,900,1.1); this.tone(D,300,t,.16,'sawtooth',.16,.35); break;
      case 'guard': this.tone(D,220,t,.12,'square',.16); this.noise(D,t,.07,.12,500,1.6); break;
      case 'good': [523,659,784,1046].forEach((f,i)=>this.tone(D,f,t+i*.06,.16,'square',.15)); break;
      case 'bad': this.tone(D,300,t,.3,'sawtooth',.18,.32); this.tone(D,150,t+.05,.3,'square',.12,.4); break;
      case 'sign': [523,659,784,1046,1318].forEach((f,i)=>this.tone(D,f,t+i*.085,.28,'square',.17));
                   [261,392].forEach((f,i)=>this.tone(D,f,t+i*.17,.5,'triangle',.14)); break;
      case 'fail': [440,392,330,247].forEach((f,i)=>this.tone(D,f,t+i*.15,.3,'square',.15)); break;
      case 'day': [392,523,659].forEach((f,i)=>this.tone(D,f,t+i*.09,.22,'triangle',.16)); break;
      case 'ap': this.tone(D,700,t,.05,'square',.1); this.tone(D,560,t+.05,.08,'square',.09); break;
      case 'deny': this.tone(D,200,t,.18,'square',.16); this.tone(D,180,t+.14,.22,'square',.13); break;
    }
  },
  /* ── BGM ── */
  play(name){
    if(this.track===name) return;
    this.track=name; this.step=0;
    this.boot(); if(!this.ctx) return;
    if(this.ctx.state==='suspended') this.ctx.resume();
    this.next=this.ctx.currentTime+.06;
    if(!this.timer) this.timer=setInterval(()=>this.sched(),25);
  },
  stop(){ this.track=null; },
  sched(){
    if(!this.ctx||!this.track||!this.on) return;
    const T=BGM[this.track]; if(!T) return;
    const spb=60/T.bpm/2; // 八分音符
    while(this.next < this.ctx.currentTime+.16){
      const s=this.step%T.len, t=this.next, M=this.mg;
      if(T.lead[s]) this.tone(M,nf(T.lead[s]),t,spb*(T.leadLen||1.5),T.leadType||'square',.20);
      if(T.harm&&T.harm[s]) this.tone(M,nf(T.harm[s]),t,spb*1.2,'triangle',.11);
      if(T.bass[s]) this.tone(M,nf(T.bass[s]),t,spb*1.7,'triangle',.26);
      const d=T.drum&&T.drum[s];
      if(d==='k'){ this.tone(M,110,t,.11,'sine',.34,.35) }
      else if(d==='s'){ this.noise(M,t,.075,.17,1700,.9) }
      else if(d==='h'){ this.noise(M,t,.025,.055,5200,1.4) }
      this.next+=spb; this.step++;
    }
  }
};

 good:{t:'「那我不多佔您一家。我只做一件事：把這條街近三個月真正過戶的實價整理給您，看看現在開的價位對不對。」',
       r:'屋主停了一下：「……你先拿來我看看。」',d:28},
 ok:{t:'「我知道很煩，我盡量不打擾您，有需要您再打給我。」',r:'屋主嘆氣：「你們每一個都這樣講。」',d:9},
 bad:[{t:'「多一家就多一個通路，一般委託又不用費用。」',r:'屋主：「就是每個都說多一家，我才會變成六家。」',d:-7,rap:24},
      {t:'「我可以幫您看哪幾家可以先退掉，留兩家做就好。」',r:'屋主：「你來教我要留誰喔？」',d:-9,rap:27}]},

{id:'buyerfirst',tag:'有買方再說',
 line:'你有買方要買，再來跟我談委託。',
 follow:'不然這樣啦，你有買方再回來找我。',
 good:{t:'「買方我會帶。但沒有委託我沒有立場開您的門，買方也不敢下斡旋。一般委託三十天，沒成交就自動結束。」',
       r:'屋主：「三十天喔……真的沒成交就沒事？」',d:29},
 ok:{t:'「好，那我先去找買方，有進度我再跟您聯絡。」',r:'屋主點頭：「對，有買方再說。」',d:7},
 bad:[{t:'「我手上現在就有客戶在看這一區，明天就可以帶過來。」',r:'屋主：「真的假的？那他要幾坪、預算多少？」你答不上來。',d:-11,rap:30},
      {t:'「那我們先口頭約定，成交的時候再補簽委託可以嗎？」',r:'屋主：「口頭？那到時候誰說了算？」',d:-8,rap:24}]},

{id:'fee',tag:'服務費太貴',
 line:'你們收四趴太貴了，我自己賣還比較划算。',
 follow:'還有服務費，你們收四趴我覺得太貴。',
 good:{t:'「服務費是成交才收，沒成交您一毛都不用付。而且可以先談成交價，服務費在成交當下再一起議。」',
       r:'屋主：「成交才收……那你不是可能白做工？」',d:28},
 ok:{t:'「服務費的部分我可以幫您跟公司爭取看看。」',r:'屋主：「爭取多少？你講清楚啊。」',d:9},
 bad:[{t:'「我可以少收一點沒關係，只要您願意簽給我。」',r:'屋主搖頭：「你連自己的價錢都守不住，我怎麼敢把房子交給你？」',d:-10,rap:28},
      {t:'「這是全台灣的行情，每一家收的都是這樣。」',r:'屋主：「行情是你們訂的，又不是我訂的。」',d:-7,rap:23}]},

{id:'selfsell',tag:'我自己賣',
 line:'我自己在網路上刊就好了，不用你們仲介。',
 follow:'反正我自己刊網路就好了，不用麻煩你們。',
 good:{t:'「自售最麻煩的其實是兩件事：陌生人進門看屋的安全，還有收了訂之後對方反悔。我可以先免費幫您看您現在的自售條件。」',
       r:'屋主沉默兩秒：「……收訂那個我還真的沒想過。」',d:28},
 ok:{t:'「自售也是一種方式，我尊重您的決定。」',r:'屋主：「對啊，我覺得沒那麼難。」',d:8},
 bad:[{t:'「自售的成交率其實不高，最後大部分還是會找仲介。」',r:'屋主：「你的意思是我一定賣不掉？」',d:-9,rap:27},
      {t:'「不然您先給我一副鑰匙，我有客戶隨時可以帶看。」',r:'屋主往門後退：「我們才第一次見面，你就要鑰匙？」',d:-11,rap:30}]},

{id:'notrush',tag:'不急著賣',
 line:'我又不急，價格到了再賣，沒到就放著。',
 follow:'反正我也不急，價格到了再說就好。',
 good:{t:'「那更適合一般委託。價格沒到就不賣，到了我通知您，您完全沒有損失，就當多一個人幫您看著市場。」',
       r:'屋主：「多一個人看著……也是啦。」',d:27},
 ok:{t:'「好，那我固定跟您回報這一區的行情。」',r:'屋主：「嗯，有消息再說。」',d:10},
 bad:[{t:'「不過現在不賣，明年可能會更難賣喔。」',r:'屋主：「你會算命喔？」',d:-8,rap:25},
      {t:'「那您先簽起來放著，反正沒到價您也不會賣。」',r:'屋主：「先簽起來放著？那你之後一定會來盧我。」',d:-9,rap:26}]},

{id:'friend',tag:'跟人很熟',
 line:'我跟某某仲介很熟，這一帶都給他做。',
 follow:'而且那邊那個某某跟我很熟，都給他做啦。',
 good:{t:'「那位前輩很專業，我不搶他的案子。我只想留一組我手上的買方條件給您，如果剛好對得上，您再叫我來就好。」',
       r:'屋主：「你倒是不搶。買方條件拿來我看看。」',d:28},
 ok:{t:'「那真好，有熟人比較安心，那我就不打擾了。」',r:'屋主：「好，慢走。」',d:6},
 bad:[{t:'「他幫您帶過幾組？我保證帶得比他多。」',r:'屋主：「你連他是誰都不知道就要比？」',d:-9,rap:27},
      {t:'「熟歸熟，做生意還是要看誰真的賣得掉。」',r:'屋主：「你這樣講我朋友喔。」',d:-8,rap:26}]},

{id:'young',tag:'嫌你菜',
 line:'你做多久了？看起來很年輕，沒經驗我不敢給你。',
 follow:'而且說真的，你看起來很年輕，做多久了？',
 good:{t:'「經驗我確實還在補，這我不騙您。但這條街我一週跑七天，誰在賣、誰在看房子我最清楚。您可以先用小事情測試我。」',
       r:'屋主上下打量你：「……敢承認的不多。」',d:29},
 ok:{t:'「我後面有資深的同事會一起支援，您放心。」',r:'屋主：「那我找你資深同事就好啦。」',d:9},
 bad:[{t:'「我做很久了，經驗很豐富，這您可以放心。」',r:'屋主：「是喔？那你講一下這棟去年成交幾件。」你答不出來。',d:-11,rap:29},
      {t:'「年輕才有衝勁，我一定跑得比別人勤。」',r:'屋主：「衝勁又不能拿來賣房子。」',d:-6,rap:20}]},

{id:'market',tag:'市場不好',
 line:'現在市場這麼冷，你簽了也是白簽。',
 follow:'再說現在市場這麼冷，簽了也賣不掉啦。',
 good:{t:'「市場冷的時候，能成交的只剩兩種：價格對的，跟資料齊的。價格是您決定，資料我來備。等市場回來，我們是第一批可以動的。」',
       r:'屋主：「……資料齊的先動，這句我記住了。」',d:28},
 ok:{t:'「是有比較冷，不過還是有在成交。」',r:'屋主：「成交幾件？你講來聽聽。」',d:10},
 bad:[{t:'「所以更要趕快處理，再等下去只會更難賣。」',r:'屋主：「你們每次都這樣講。」',d:-8,rap:26},
      {t:'「那我們價格先修一點，市場冷就要有誠意。」',r:'屋主火了：「我還沒開價你就叫我降？」',d:-12,rap:32}]},

{id:'price',tag:'開天價',
 line:'我就是要開這個價，做不到就不用談了。',
 follow:'還有價格，我就是要開這個價，不然免談。',
 good:{t:'「這個價我不敢跟您保證。但我可以做一件事：三週內幫您帶足看屋量，讓市場回答您這個價。要不要調，到時候您自己決定。」',
       r:'屋主：「讓市場回答……好，我倒想看看。」',d:29},
 ok:{t:'「這個價是偏高一點，不過我們可以先試試看。」',r:'屋主：「試試看是什麼意思？」',d:9},
 bad:[{t:'「這個價沒問題，我保證幫您賣掉。」',r:'屋主：「你保證？那賣不掉你賠我喔？」',d:-10,rap:28},
      {t:'「這個價跟行情差滿多的，恐怕沒有買方會出。」',r:'屋主：「不可能你來幹嘛？」',d:-9,rap:27}]},

{id:'family',tag:'要問家人',
 line:'這個我要跟家人商量，我一個人不能決定。',
 follow:'而且這種事我要跟家人商量，我不能自己決定。',
 good:{t:'「當然要。我留兩份資料，一份給您、一份給家裡的人。禮拜六我再過來一趟，那時候還沒討論好也沒關係。」',
       r:'屋主：「你還會再來喔？好，禮拜六。」',d:26},
 ok:{t:'「好，那您跟家人討論好再打給我。」',r:'屋主：「嗯，再說。」',d:11},
 bad:[{t:'「不然您留家人的電話，我直接跟他說明比較快。」',r:'屋主整個人退一步：「你要打給我家人？」',d:-12,rap:33},
      {t:'「其實這只是一般委託，還不到要全家商量的程度。」',r:'屋主：「我們家的事，你來說不用商量？」',d:-10,rap:28}]},

{id:'distrust',tag:'不信仲介',
 line:'你們仲介都嘛在騙人，我以前被坑過。',
 follow:'說到底，你們仲介我信不過，我以前被坑過。',
 good:{t:'「有人做壞了我沒辦法替他解釋。我只能做一件事：每一步都寫在紙上給您，價格怎麼來、買方是誰、談到哪裡，您隨時可以叫停。」',
       r:'屋主看了你很久：「寫在紙上……你敢寫喔？」',d:30},
 ok:{t:'「我們公司有規範，不會亂來的。」',r:'屋主：「公司規範我聽多了。」',d:9},
 bad:[{t:'「那是少數啦，我們公司跟他們不一樣。」',r:'屋主：「每一家都說自己不一樣。」',d:-7,rap:24},
      {t:'「您那時候是被哪一家坑的？我幫您去問問看。」',r:'屋主：「關你什麼事？」',d:-9,rap:26}]},

{id:'tenant',tag:'租約中',
 line:'房子還在出租，租客在裡面，很不方便。',
 follow:'而且我這間還在出租，租客在裡面欸。',
 good:{t:'「租約我幫您整理成帶看條件，租客方便的時段我來排。買方也可以接手租約，這反而是賣點。」',
       r:'屋主：「還可以當賣點喔？」',d:28},
 ok:{t:'「那我們等租約到期再處理好了。」',r:'屋主：「還有一年多欸。」',d:8},
 bad:[{t:'「那我直接跟租客聯絡，約他方便的時間就好。」',r:'屋主：「你未經我同意去找我租客？」',d:-10,rap:29},
      {t:'「有租客在比較難賣，看能不能請他先搬。」',r:'屋主：「你叫我違約？」',d:-11,rap:30}]},

{id:'neighbor',tag:'比隔壁',
 line:'隔壁那間開得比我高，我幹嘛賣便宜？',
 follow:'而且隔壁那間開得比我高，我為什麼要賣便宜？',
 good:{t:'「開價跟成交價是兩回事。我把這棟近一年真正過戶的實登印給您，我們一起看隔壁那間到底成交了沒。」',
       r:'屋主：「……他好像掛一年多了齁。」',d:29},
 ok:{t:'「隔壁那間的條件跟您這間不太一樣。」',r:'屋主：「哪裡不一樣？你講啊。」',d:10},
 bad:[{t:'「隔壁那間開太高了，那個價不可能賣掉。」',r:'屋主：「那你怎麼不去跟他講？」',d:-6,rap:21},
      {t:'「那您就開跟他一樣好了，反正大家都這樣開。」',r:'屋主：「你自己都沒有看法喔？」',d:-8,rap:25}]},

{id:'later',tag:'改天再說',
 line:'我現在很忙啦，改天再說改天再說。',
 follow:'歹勢，我等一下要出門，改天再說啦。',
 good:{t:'「那我三分鐘就好。我只留一份這區的行情表跟名片，您有空翻一下，下次我從這邊經過再跟您打招呼。」',
       r:'屋主接過名片：「三分鐘……好啦，資料放這。」',d:26},
 ok:{t:'「那我改天再來拜訪您。」',r:'屋主：「好好好。」門闔上了一半。',d:8},
 bad:[{t:'「就一下下而已，我講很快！」（結果你講了十分鐘。）',r:'屋主看了三次手錶：「先生，我真的要出門了。」',d:-8,rap:27},
      {t:'「那您什麼時候有空？我配合您的時間。」',r:'屋主：「我不知道啊，我就是忙。」',d:-4,rap:18}]},

{id:'nodoc',tag:'不給資料',
 line:'我不想給你任何資料，你們拿去亂用。',
 follow:'還有喔，我不會給你任何資料。',
 good:{t:'「您不用給我任何資料。謄本是公開的，我已經自己調了；其他的等您哪天願意再說。」',
       r:'屋主挑了下眉：「你已經調了？……你倒是老實。」',d:28},
 ok:{t:'「我們有保密規範，資料不會外流的。」',r:'屋主：「規範規範，都嘛是講講。」',d:9},
 bad:[{t:'「那至少給我權狀影本，不然後面沒辦法作業。」',r:'屋主：「我就說不給，你還一直要。」',d:-10,rap:28},
      {t:'「沒有資料的話，價格我也沒辦法幫您評估喔。」',r:'屋主：「你這是在威脅我？」',d:-11,rap:30}]},

{id:'onlyone',tag:'沒聽過你們',
 line:'我只想找一家做，而且你們公司我沒聽過。',
 follow:'再說我只想找一家，你們這間我也沒聽過。',
 good:{t:'「沒聽過很正常，我們是只做這一區的直營小店。您可以先看我在這一區的成交紀錄，再決定要不要用我。」',
       r:'屋主：「只做這一區喔……那你應該很熟。」',d:28},
 ok:{t:'「我們是連鎖的，全省都有店。」',r:'屋主：「有店跟賣得掉是兩回事。」',d:8},
 bad:[{t:'「大品牌的廣告費都算在服務費裡，我們比較實在。」',r:'屋主：「你這樣講人家喔。」',d:-8,rap:25},
      {t:'「您可以上網查我們公司，評價都很好。」',r:'屋主：「網路評價我更不信。」',d:-6,rap:21}]},

{id:'taxes',tag:'稅太重',
 line:'我賣掉要繳一堆稅，算下來根本不划算。',
 follow:'還有稅啊，賣掉要繳一堆稅，划不來。',
 good:{t:'「稅我不會亂算給您。我可以先幫您把持有年限跟當初取得成本整理出來，讓您看到真正的數字再決定。」',
       r:'屋主：「你會算喔？那你算給我看。」',d:29},
 ok:{t:'「稅的部分您可以問一下代書比較準。」',r:'屋主：「所以你也不懂嘛。」',d:9},
 bad:[{t:'「稅一定有辦法處理啦，我們有配合的代書。」',r:'屋主：「有辦法是什麼意思？」',d:-10,rap:28},
      {t:'「不然買賣契約的價格寫低一點，稅就少很多。」',r:'屋主臉色一變：「你叫我做假？」',d:-14,rap:38}]},

{id:'memory',tag:'有感情',
 line:'這間是我爸留下來的，我其實還在猶豫。',
 follow:'說真的，這間是我爸留下來的，我還在猶豫。',
 good:{t:'「那不急。委託我可以先不簽，今天我只想把資料留給您，等您想清楚了再說。」',
       r:'屋主抬頭看你：「……你不逼我喔？」',d:28},
 ok:{t:'「我了解，這種事本來就需要一點時間。」',r:'屋主：「嗯。」',d:11},
 bad:[{t:'「房子放著也是折舊，早點處理才不會虧。」',r:'屋主的語氣沉下來：「你懂什麼。」',d:-12,rap:34},
      {t:'「那不然先簽起來，您想賣的時候我馬上動。」',r:'屋主：「我就說我還在猶豫。」',d:-9,rap:26}]},

{id:'suspicious',tag:'懷疑來路',
 line:'等一下，你怎麼知道我這間在賣？誰跟你講的？',
 follow:'不對，你怎麼會知道我這間在賣？',
 good:{t:'「您門口掛了售的牌子，我照著門牌調了謄本。您如果不想被打擾，我現在就把資料收起來。」',
       r:'屋主看了牆上一眼：「……你倒是講得清楚。」',d:28},
 ok:{t:'「我是這附近跑街的，看到牌子就過來了。」',r:'屋主：「喔，那個牌子喔。」',d:11},
 bad:[{t:'「這是我們公司的資料庫，來源不太方便講。」',r:'屋主：「不方便講？那我更不敢跟你談。」',d:-11,rap:31},
      {t:'「是您鄰居跟我提的，說您好像要賣。」',r:'屋主：「哪個鄰居？我要去問。」',d:-9,rap:27}]},

{id:'sold',tag:'已經在談',
 line:'已經有一組在談了，我在等他回覆。',
 follow:'而且我這邊已經有一組在談了。',
 good:{t:'「那先恭喜您。如果那組談成，我第一個道賀；如果沒成，我禮拜三再來一趟，您不用特別通知我。」',
       r:'屋主笑了一下：「你這樣講，我還真不好意思叫你別來。」',d:27},
 ok:{t:'「好，那我等您的消息。」',r:'屋主：「好。」',d:9},
 bad:[{t:'「那組如果價格不到，其實不用等，我這邊條件更好。」',r:'屋主：「你連價格都不知道就說更好？」',d:-10,rap:28},
      {t:'「口頭談的其實不算數，沒下斡旋都不算。」',r:'屋主：「人家很有誠意欸。」',d:-8,rap:25}]},

{id:'photo',tag:'不給拍照',
 line:'拍照？不行，我不想讓鄰居知道我在賣。',
 follow:'還有喔，不要拍照，我不想讓鄰居知道。',
 good:{t:'「不拍。我可以只寫格局跟坪數，不放照片、不寫門牌，買方要看再現場約。」',
       r:'屋主：「還可以這樣喔？」',d:28},
 ok:{t:'「那我先不拍，之後有需要再說。」',r:'屋主：「總之先不要。」',d:10},
 bad:[{t:'「沒有照片買方不會點進來看，這樣真的很難賣。」',r:'屋主：「那就不要賣。」',d:-9,rap:27},
      {t:'「我拍起來自己留著參考，不會放上網。」',r:'屋主：「你自己留著要幹嘛？」',d:-10,rap:28}]},

{id:'rushvisit',tag:'不配合帶看',
 line:'我人不住這邊，帶看我沒辦法配合啦。',

/* ── 本機評分引擎 ───────────────────────────────────────── */
function coachScore(mvId,text,prev){
  const t=String(text||'').trim();
  const H=MOVE_HINTS[mvId]||{k:[],tip:''};
  const notes=[], tips=[];
  let missNote=false;
  let s=14;

  if(t.length<6) return {score:0,band:'bad',
    note:'太短了，屋主聽不出你要表達什麼。',tip:H.tip||'',short:true};
  if(prev&&prev.some(p=>p===t)) return {score:5,band:'bad',
    note:'同樣的話你已經講過一次了，他不會有第二種反應。',tip:H.tip||''};

  // 地雷
  let mine=0, mineWhy='';
  for(const L of LANDMINES){ if(L.re.test(t)){ mine+=L.w; if(!mineWhy) mineWhy=L.why } }
  if(mine){ s-=Math.min(70,mine); notes.push('踩到地雷——'+mineWhy) }

  // 破綻關鍵字
  const hits=H.k.filter(k=>t.indexOf(k)>=0);
  if(hits.length){
    s+=Math.min(44,hits.length*15);
    notes.push('有講到這一招的關鍵：「'+hits.slice(0,3).join('」「')+'」');
  }else if(!mine){
    missNote=true;
  }

  // 承接情緒
  if(EMPATHY.test(t)){ s+=11; notes.push('有先承接他的情緒') }
  else if(!mine) tips.push('先接住他的話再講你的');

  // 具體下一步
  if(CONCRETE.test(t)){ s+=13; notes.push('有給出具體、對他零成本的下一步') }
  else if(!mine) tips.push('缺一個他今天就能答應的具體動作');

  // 不亂保證
  if(NOCOMMIT.test(t)){ s+=8; notes.push('沒有亂開支票，這是加分的') }
  // 有禮貌地問
  if(ASKQ.test(t)) s+=6;

  // 長度
  if(t.length<14) s-=8;
  else if(t.length>90) { s-=6; tips.push('話太長了，屋主站在門口聽不完') }
  else if(t.length>=24&&t.length<=80) s+=4;

  if(missNote) notes.push('但沒有回應到他真正在意的那一點');
  s=Math.max(0,Math.min(100,Math.round(s)));
  const band = s>=72?'hi' : s>=48?'mid' : s>=26?'low' : 'bad';
  return {score:s,band,note:notes.join('；')||'他沒什麼反應。',
    tip:(tips.length?tips.join('；')+'。':'')+(H.tip||'')};
}

function coachReply(mv,band,isGuard){
  const bank=isGuard?GUARD_BAND_REPLY:BAND_REPLY;
  if(band==='hi'&&mv&&mv.good) return Math.random()<.62?mv.good.r:pickA(bank.hi);
  if(band==='mid'&&mv&&mv.ok)  return Math.random()<.55?mv.ok.r:pickA(bank.mid);
  if(band==='bad'&&mv&&mv.bad) return Math.random()<.5?mv.bad[Math.floor(Math.random()*mv.bad.length)].r:pickA(bank.bad);
  return pickA(bank[band]||bank.mid);
}
function pickA(a){ return a[Math.floor(Math.random()*a.length)] }

function probeScore(i,text){
  const Q=PROBE_Q[i], t=String(text||'').trim();
  if(t.length<5) return {ok:false,score:0,note:'太短了，對方聽不懂你要幹嘛。',tip:Q.tip};
  for(const b of Q.bad){ if(b.re.test(t)) return {ok:false,score:8,note:'踩到地雷——'+b.why,tip:Q.tip} }
  const hits=Q.k.filter(k=>t.indexOf(k)>=0);
  let s=18+hits.length*20+(EMPATHY.test(t)?12:0)+(t.length>=14?6:0);
  s=Math.min(100,s);
  return {ok:s>=50,score:s,
    note:hits.length?('有講到重點：「'+hits.slice(0,2).join('」「')+'」'):'沒有講到對方在意的點',
    tip:Q.tip};
}

/* ═══════════════════════════════════════════════════════════
   世界：城市生成、門牌編碼、謄本資料、像素繪圖
   ═══════════════════════════════════════════════════════════ */

const TS=16;                 // tile size
const PX=14, PY=12, ROADW=3; // 街廓周期
const BX=6, BY=5;            // 街廓數
const MW=ROADW+BX*PX;        // 87
const MH=ROADW+BY*PY;        // 63
let VW=480, VH=320;   // 由 fitStage 依螢幕比例調整

/* tile: 0 馬路 1 人行道 2 建物 3 巷弄 4 門面 5 公司門口 */
const T_ROAD=0,T_WALK=1,T_BLD=2,T_ALLEY=3,T_DOOR=4,T_OFFICE=5;

const World={
  seed:'', tiles:null, houses:[], byTile:new Map(),
  blockTint:[], lampPos:[], props:[], officeId:-1,

  gen(seed){
    this.seed=seed; const r=rngFor(seed,'city');
    const t=new Uint8Array(MW*MH); this.tiles=t;
    const isRX=x=>{const m=x%PX;return m<ROADW};
    const isRY=y=>{const m=y%PY;return m<ROADW};
    for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){
      t[y*MW+x]=(isRX(x)||isRY(y))?T_ROAD:T_BLD;
    }
    // 街廓內開巷弄
    this.blockTint=[];
    for(let by=0;by<BY;by++)for(let bx=0;bx<BX;bx++){
      const x0=bx*PX+ROADW, y0=by*PY+ROADW, bw=PX-ROADW, bh=PY-ROADW;
      this.blockTint.push(pick(r,['#c9bda6','#d6cbb4','#bfc4c9','#c4cbbc','#d2bfb4','#b9c3cc','#cdc3ad']));
      if(r()<.72){ const ax=x0+ri(r,2,bw-3); for(let y=y0-ROADW;y<y0+bh+ROADW;y++){ if(y>=0&&y<MH&&t[y*MW+ax]===T_BLD) t[y*MW+ax]=T_ALLEY } }
      if(r()<.60){ const ay=y0+ri(r,2,bh-3); for(let x=x0-ROADW;x<x0+bw+ROADW;x++){ if(x>=0&&x<MW&&t[ay*MW+x]===T_BLD) t[ay*MW+x]=T_ALLEY } }
    }
    // 門面候選：建物且四鄰有可走
    const cand=[];
    const walk=(x,y)=>x>=0&&y>=0&&x<MW&&y<MH&&(t[y*MW+x]===T_ROAD||t[y*MW+x]===T_ALLEY);
    for(let y=1;y<MH-1;y++)for(let x=1;x<MW-1;x++){
      if(t[y*MW+x]!==T_BLD) continue;
      if(walk(x,y+1)) cand.push({x,y,d:2});   // 門一律朝南，才畫得出完整立面
    }
    // 依序取門，保持間距
    const taken=new Set(); const houses=[];
    for(const c of shuffled(r,cand)){
      let near=false;
      for(let dy=-4;dy<=1;dy++)for(let dx=-2;dx<=2;dx++) if(taken.has((c.y+dy)+'_'+(c.x+dx))) near=true;
      if(near) continue;
      taken.add(c.y+'_'+c.x);
      houses.push({id:houses.length,x:c.x,y:c.y,dir:c.d});
    }
    this.houses=houses;
    // 編門牌
    const used=new Set();
    for(const h of houses){ h.addr=this.makeAddr(h,used); }
    this.byTile=new Map(); houses.forEach(h=>this.byTile.set(h.y*MW+h.x,h));

    // 建物型態：大樓／公寓／透天／店面
    for(const h of houses){
      const hr=rngFor(seed,'bt'+h.id), u=hr();
      const onAlley=this.at(h.x,h.y+1)===T_ALLEY;
      const corner=this.at(h.x-1,h.y)===T_ROAD||this.at(h.x+1,h.y)===T_ROAD;
      if(onAlley)      h.bt = u<.46?'town'  : u<.88?'walkup':'tower';   // 巷子裡少有大樓
      else if(corner)  h.bt = u<.42?'shop'  : u<.72?'tower' :'walkup';
      else             h.bt = u<.30?'tower' : u<.56?'shop'  : u<.82?'walkup':'town';
      h.floors = h.bt==='tower'?ri(hr,9,15) : h.bt==='walkup'?ri(hr,4,5)
               : h.bt==='town'?ri(hr,3,4) : ri(hr,1,2);
      h.tone = hr();
    }

    // 公司：挑一個靠近地圖中央、面向大馬路的門
    let best=null,bd=1e9;
    for(const h of houses){
      if(h.dir!==0&&h.dir!==2) continue;
      const dx=h.x-Math.floor(MW/2), dy=h.y-Math.floor(MH/2), dd=dx*dx+dy*dy;
      if(dd<bd){bd=dd;best=h}
    }
    best=best||houses[0]; best.office=true; this.officeId=best.id;
    t[best.y*MW+best.x]=T_OFFICE;

    // 掛售物件
    const pool=shuffled(r,houses.filter(h=>!h.office));
    const N=Math.min(28,pool.length);
    for(let i=0;i<N;i++){ pool[i].sale=true; }
    for(const h of houses) if(h.sale) t[h.y*MW+h.x]=T_DOOR;

    // 路燈與街景雜物
    this.lampPos=[];
    for(let by=0;by<=BY;by++)for(let bx=0;bx<=BX;bx++){
      this.lampPos.push({x:bx*PX+1,y:by*PY+1});
    }
    this.props=[];
    const pr=rngFor(seed,'props');
    for(let i=0;i<420;i++){
      const x=ri(pr,0,MW-1), y=ri(pr,0,MH-1);
      if(t[y*MW+x]!==T_ROAD) continue;
      const nb=[[0,-1],[0,1],[-1,0],[1,0]].some(([a,b])=>{const q=t[(y+b)*MW+(x+a)];return q===T_BLD||q===T_DOOR||q===T_OFFICE});
      if(!nb) continue;
      this.props.push({x,y,k:Math.floor(pr()*4),o:pr()});
    }
    return this;
  },

  at(x,y){ if(x<0||y<0||x>=MW||y>=MH) return T_BLD; return this.tiles[y*MW+x]; },
  solid(x,y){ const v=this.at(x,y); return !(v===T_ROAD||v===T_ALLEY) },
  house(x,y){ return this.byTile.get(y*MW+x) },

  distIdx(x,y){ const bx=Math.floor(x/PX), by=Math.floor(y/PY); return (bx<2?0:bx<4?1:2)+(by<3?0:3) },

  makeAddr(h,used){
    const dist=DISTRICTS[this.distIdx(h.x,h.y)];
    const wx=h.x+(h.dir===1?1:h.dir===3?-1:0), wy=h.y+(h.dir===2?1:h.dir===0?-1:0);
    const onAlley=this.at(wx,wy)===T_ALLEY;
    let street,num,lane=0;
    const corner=!onAlley&&(this.at(h.x-1,h.y)===T_ROAD||this.at(h.x+1,h.y)===T_ROAD);
    if(corner){ // 轉角店面掛在縱向的「路」上
      street=RD_NAMES[Math.max(0,Math.min(RD_NAMES.length-1,Math.round(h.x/PX)))];
      num=(h.y+2)*2-1;
    }else{
      street=ST_NAMES[Math.max(0,Math.min(ST_NAMES.length-1,Math.round(h.y/PY)))];
      num=(h.x+2)*2-(h.dir===2?1:0);
      if(onAlley){ lane=(h.x+2)*2-1; num=Math.max(1,(h.y%PY)*2+(h.dir===2?1:2)) }
    }
    let s;
    for(let bump=0;bump<40;bump++){
      s=CITY_NAME+dist+street+(lane?lane+'巷':'')+(num+bump*2)+'號';
      if(!used.has(s)){ used.add(s); return {full:s,street:CITY_NAME+dist+street+(lane?lane+'巷':''),num:num+bump*2} }
    }
    used.add(s); return {full:s,street:CITY_NAME+dist+street,num};
  },

  /* 二類謄本：由 seed + id 決定，重開遊戲一致 */
  deed(h){
    if(h._deed) return h._deed;
    const r=rngFor(this.seed,'deed'+h.id);
    const bt=h.bt||'walkup';
    const m2 = bt==='tower'  ? Math.round((ri(r,72,168)+r())*100)/100
             : bt==='walkup' ? Math.round((ri(r,58,122)+r())*100)/100
             : bt==='town'   ? Math.round((ri(r,118,235)+r())*100)/100
             :                 Math.round((ri(r,66,180)+r())*100)/100;
    const ping=Math.round(m2/3.305785*100)/100;
    const total = h.floors || ri(r,4,14);
    const floor = bt==='town' ? 1 : ri(r,1,Math.min(total,12));
    const year=ri(r,1982,2019);
    const owner=pick(r,SURNAMES);
    const masked=r()<.32;
    // 戶籍地：城裡另一個門牌
    const others=this.houses.filter(o=>o.id!==h.id&&!o.office);
    const reg=others[Math.floor(r()*others.length)];
    const type=pick(r,OWNER_TYPES);
    const why=pick(r,SELL_WHY);
    // 招式：先挑一個符合性格的開場，再接五招（每位屋主的劇本固定且不同）
    const mr=rngFor(this.seed,'mv'+h.id);
    const opens=MOVES.filter(m=>type.open.indexOf(m.id)>=0);
    const first=opens.length?opens[Math.floor(mr()*opens.length)]:MOVES[0];
    const rest=shuffled(mr,MOVES.filter(m=>m.id!==first.id)).slice(0,6);
    const moves=[first].concat(rest);
    const cold=Math.min(3,type.cold+(r()<0.28?1:0));
    const d={
      m2,ping,floor,total,year,
      bt, btName: BT_NAME[bt],
      use: bt==='tower'?'集合住宅' : bt==='shop'?'店鋪' : bt==='town'?pick(r,['住家用','住商用']) : '住家用',
      mat: bt==='tower'?pick(r,['鋼筋混凝土造','鋼骨鋼筋混凝土造'])
         : bt==='town'?pick(r,['鋼筋混凝土造','加強磚造']) : pick(r,BUILD_MAT),
      ownerSur:owner, ownerName:owner+'**',
      masked, regId:reg.id,
      regFull:reg.addr.full, regMasked:reg.addr.street+'**',
      type,why,moves,cold,
      guard:type.guard+ri(r,-10,14),
      no:'溪虹建字第'+(100000+h.id*137%899999)+'號'
    };
    h._deed=d; return d;
  }
};

/* ═══ 繪圖 ═══════════════════════════════════════════════ */
const cv=document.getElementById('cv');
const cx=cv.getContext('2d');
cx.imageSmoothingEnabled=false;
function setViewport(w,h){
  if(w===VW&&h===VH) return;
  VW=w; VH=h; cv.width=w; cv.height=h; cx.imageSmoothingEnabled=false;
}

function px(v){return Math.round(v)}
function rect(x,y,w,h,c){cx.fillStyle=c;cx.fillRect(px(x),px(y),Math.ceil(w),Math.ceil(h))}

const Cam={x:0,y:0};
function camTo(cxp,cyp){
  Cam.x=Math.max(0,Math.min(MW*TS-VW, cxp-VW/2));
  Cam.y=Math.max(0,Math.min(MH*TS-VH, cyp-VH/2));
}

function tileHash(x,y){return ((x*73856093)^(y*19349663))>>>0}

function drawCity(t){
  const ox=Math.floor(Cam.x), oy=Math.floor(Cam.y);
  const tx0=Math.floor(ox/TS), ty0=Math.floor(oy/TS);
  rect(0,0,VW,VH,'#9fb0b6');
  for(let ty=ty0-1;ty<ty0+VH/TS+2;ty++){
    for(let tx=tx0-1;tx<tx0+VW/TS+2;tx++){
      const sx=tx*TS-ox, sy=ty*TS-oy;
      const v=World.at(tx,ty);
      const hsh=tileHash(tx,ty);
      if(v===T_ROAD){
        rect(sx,sy,TS,TS,'#8d9298');
        if((hsh&7)===0) rect(sx+3,sy+5,3,2,'#9aa0a6');
        // 中央虛線
        if(tx%PX===1&&ty%2===0) rect(sx+7,sy+2,2,9,'#e6d089');
        if(ty%PY===1&&tx%2===0) rect(sx+2,sy+7,9,2,'#e6d089');
        // 人行道邊
        if(World.at(tx,ty-1)>=T_BLD) rect(sx,sy,TS,3,'#c2c0b4');
        if(World.at(tx,ty+1)>=T_BLD) rect(sx,sy+TS-3,TS,3,'#c2c0b4');
        if(World.at(tx-1,ty)>=T_BLD) rect(sx,sy,3,TS,'#c2c0b4');
        if(World.at(tx+1,ty)>=T_BLD) rect(sx+TS-3,sy,3,TS,'#c2c0b4');
      }else if(v===T_ALLEY){
        rect(sx,sy,TS,TS,'#7f858c');
        if((hsh&3)===0) rect(sx+4,sy+9,4,2,'#8b9198');
        if((hsh&15)===3) rect(sx+2,sy+2,5,7,'#b08d5e'); // 紙箱
      }else{
        const bi=(Math.floor(ty/PY)*BX+Math.floor(tx/PX))%World.blockTint.length;
        const base=World.blockTint[(bi+World.blockTint.length)%World.blockTint.length]||'#c9bda6';
        const open=v=>v===T_ROAD||v===T_ALLEY;
        const front=open(World.at(tx,ty+1));
        const back =open(World.at(tx,ty-1));
        if(front){
          // 臨街立面：連續的街屋牆
          rect(sx,sy,TS,TS,base);
          rect(sx,sy,TS,3,'rgba(255,255,255,.20)');
          rect(sx,sy+TS-4,TS,4,'#8e8a80');
          for(let i=0;i<2;i++){
            rect(sx+3+i*7,sy+5,4,4,'#93a2ac');
            rect(sx+3+i*7,sy+5,4,1,'#b8c6ce');
          }
        }else if(back){
          // 背面：後陽台、冷氣、鐵窗
          rect(sx,sy,TS,TS,base);
          rect(sx,sy,TS,3,'#a49b88');
          rect(sx,sy+3,TS,2,'rgba(0,0,0,.10)');
          if((hsh&3)!==0){ rect(sx+2,sy+7,5,5,'#9aa6ad'); rect(sx+3,sy+8,3,3,'#7f8b93') }
          if((hsh&7)>3){ rect(sx+9,sy+6,5,4,'#c9c2b2'); rect(sx+9,sy+6,5,1,'#e0dacb') }
        }else{
          // 屋頂：從上面看下去的頂樓
          rect(sx,sy,TS,TS,base);
          rect(sx+1,sy+1,TS-2,TS-2,'rgba(255,255,255,.09)');
          const k=hsh%11;
          if(k===0){ // 水塔
            rect(sx+4,sy+4,8,8,'#8fa0ab'); rect(sx+4,sy+4,8,2,'#b4c2cb');
            rect(sx+5,sy+12,2,3,'#78848d'); rect(sx+9,sy+12,2,3,'#78848d');
          }else if(k===1){ // 頂樓加蓋
            rect(sx+2,sy+3,12,10,'#cfc4ac'); rect(sx+2,sy+3,12,3,'#8d8471');
            rect(sx+6,sy+8,4,5,'#8fa9b8');
          }else if(k===2){ // 樓梯間
            rect(sx+3,sy+2,9,9,'#bfb6a2'); rect(sx+3,sy+2,9,2,'#9a917e');
          }else if(k===3){ // 冷氣室外機
            rect(sx+3,sy+6,6,5,'#b9c0c5'); rect(sx+3,sy+6,6,1,'#d6dbde');
            rect(sx+10,sy+7,4,4,'#b9c0c5');
          }else if(k===4){ // 曬衣桿
            rect(sx+2,sy+5,12,1,'#8d8674'); rect(sx+2,sy+9,12,1,'#8d8674');
            rect(sx+4,sy+5,2,4,'#dfe3e6'); rect(sx+9,sy+9,3,4,'#e6d3c0');
          }else if(k===5){ // 女兒牆分戶線
            rect(sx,sy+7,TS,2,'#a49b88');
          }else if(k===6){ // 舊招牌／雜物
            rect(sx+3,sy+4,10,3,'#a8907a'); rect(sx+5,sy+9,6,4,'#9aa2a8');
          }
        }
        // 街廓邊緣壓深，屋頂才有「一棟一棟」的層次
        if(open(World.at(tx-1,ty))) rect(sx,sy,2,TS,'rgba(60,56,48,.22)');
        if(open(World.at(tx+1,ty))) rect(sx+TS-2,sy,2,TS,'rgba(60,56,48,.22)');
      }
    }
  }
  // 街景雜物
  for(const p of World.props){
    const sx=p.x*TS-ox, sy=p.y*TS-oy;
    if(sx<-TS||sy<-TS||sx>VW||sy>VH) continue;
    if(p.k===0){ // 機車
      rect(sx+2,sy+7,11,4,'#6b7480'); rect(sx+2,sy+10,3,3,'#3a3d42'); rect(sx+10,sy+10,3,3,'#3a3d42');
      rect(sx+5,sy+4,4,4,p.o>.5?'#b8483c':'#4a6f9c');
    }else if(p.k===1){ // 電線桿
      rect(sx+7,sy+1,2,14,'#8d8b86'); rect(sx+4,sy+2,8,2,'#9d9b96');
    }else if(p.k===2){ // 盆栽／小樹
      rect(sx+5,sy+9,6,5,'#8a6142'); rect(sx+3,sy+2,10,8,'#5d9c5f'); rect(sx+5,sy+3,4,3,'#7fc07d');
    }else{ // 招牌燈箱
      rect(sx+2,sy+2,12,6,p.o>.5?'#e0574c':'#3f8ac9'); rect(sx+3,sy+3,10,2,'rgba(255,255,255,.55)');
    }
  }
  // 路燈光暈
  for(const L of World.lampPos){
    const sx=L.x*TS-ox, sy=L.y*TS-oy;
    if(sx<-70||sy<-70||sx>VW+70||sy>VH+70) continue;
    rect(sx+9,sy+13,5,2,'rgba(40,46,52,.18)');
    rect(sx+7,sy+2,2,12,'#8e949c'); rect(sx+4,sy,8,3,'#d8dade');
  }
  // 門面
  for(const h of World.houses){
    const sx=h.x*TS-ox, sy=h.y*TS-oy;
    if(sx<-40||sy<-80||sx>VW+40||sy>VH+40) continue;
    drawFacade(h,sx,sy,t);
  }
}

/* 建物立面：一律朝南，往上長出樓層 */

    const H=52, y0=sy-H+TS;

    rect(sx+2,y0-5,7,5,P.dark); rect(sx+3,y0-4,5,3,'#b7c2c9');   // 水塔
    rect(sx+11,y0-3,4,3,P.trim);                       // 機房
    for(let f=0;f<5;f++){                              // 一格一格的窗
      const wy=y0+6+f*8;
      for(let i=0;i<3;i++){
        const on=((h.id*7+f*3+i)%5)>2;

    rect(sx-3,sy+1,6,TS-1,'#9fb8c8'); rect(sx-2,sy+2,4,TS-3,P.glass); // 警衛室窗
  }else if(bt==='walkup'){
    const H=38, y0=sy-H+TS;
    rect(sx-2,y0,TS+4,H,P.wall);
    rect(sx-2,y0,TS+4,3,P.trim);
    rect(sx+1,y0-4,8,4,'#c8bda6'); rect(sx+1,y0-4,8,1,'#ddd3bf');  // 頂樓加蓋
    for(let f=0;f<3;f++){
      const wy=y0+7+f*10;
      for(let i=0;i<2;i++){
        rect(sx+i*8,wy,6,7,P.glass);
        rect(sx+i*8,wy,6,1,P.lit);

        rect(sx+i*8,wy,6,7,'rgba(70,64,54,.0)');

      }
    }
    rect(sx-2,sy-1,TS+4,2,P.dark);
  }else if(bt==='town'){
    const H=34, y0=sy-H+TS;
    rect(sx-1,y0+3,TS+2,H-3,P.wall);
    rect(sx-2,y0,TS+4,4,'#9c6b4f'); rect(sx-2,y0,TS+4,2,'#bb8560');  // 斜屋簷
    for(let f=0;f<2;f++){
      const wy=y0+9+f*11;
      rect(sx+2,wy,11,6,P.glass); rect(sx+2,wy,11,1,P.lit);
      rect(sx+1,wy+7,13,2,P.trim);                    // 陽台欄杆
      rect(sx+3,wy+7,1,2,P.dark); rect(sx+7,wy+7,1,2,P.dark); rect(sx+11,wy+7,1,2,P.dark);
    }
    rect(sx+1,sy+2,7,TS-3,'#a9a49a');                 // 鐵捲門車庫
    for(let g=0;g<5;g++) rect(sx+1,sy+3+g*2,7,1,'#8e8a80');
  }else{ // 店面
    const H=26, y0=sy-H+TS;
    rect(sx-2,y0+7,TS+4,H-7,P.wall);
    rect(sx-2,y0,TS+4,8, tone>.5?'#c2453c':'#2f6ba0');   // 大招牌
    rect(sx-2,y0,TS+4,2,'rgba(255,255,255,.45)');
    rect(sx-1,y0+3,TS+2,2,'rgba(255,255,255,.30)');
    rect(sx-2,sy-3,TS+4,4, tone>.5?'#e8d9b8':'#cdd8dd'); // 遮陽棚
    for(let i=0;i<4;i++) rect(sx-2+i*4,sy-3,2,4,'rgba(190,120,80,.45)');
    rect(sx-1,sy+1,TS+2,TS-1,P.glass);                  // 落地玻璃
    rect(sx-1,sy+1,TS+2,2,P.lit);

}

function drawFacade(h,sx,sy,t){
  const isOffice=!!h.office;
  drawBody(h,sx,sy);
  if(!isOffice && !h.sale) return;
  // 雨遮
  rect(sx-1,sy+1,TS+2,4, isOffice?'#c4831f':'#8a3b32');
  rect(sx-1,sy+1,TS+2,2, isOffice?'#f6b23c':'#b8564a');
  // 門
  rect(sx+3,sy+6,10,10,'#6f6a62');
  rect(sx+4,sy+7,8,9, isOffice?'#4d7099':'#7a5c3e');
  rect(sx+10,sy+11,2,2,'#d8c48a');
  if(isOffice){
    rect(sx+1,sy+11,14,5,'#3a4048');
    rect(sx+2,sy+12,12,3,'#f6b23c');
    cx.fillStyle='#141a22'; cx.font='700 6px "Noto Sans TC",sans-serif'; cx.textAlign='center'; cx.textBaseline='middle';
    cx.fillText('日勝',sx+8,sy+14);
    cx.textAlign='left'; cx.textBaseline='alphabetic';
  }
  if(h.sale){
    const st=Game.hs(h.id);
    const bob=Math.sin(t/420+h.id)*1.2;
    const py0=sy-15+bob;
    rect(sx+7,sy-4,2,6,'#6b6b6b');
    // 招牌
    const done=st.signed, no=st.refused;
    rect(sx+1,py0,14,12,'#4a4f57');
    rect(sx+2,py0+1,12,10, done?'#54b98d':no?'#6b5a52':'#f6b23c');
    cx.fillStyle= done?'#0d2b1f':no?'#2e2620':'#3a2a06';
    cx.font='900 9px "Noto Sans TC",sans-serif'; cx.textAlign='center'; cx.textBaseline='middle';
    cx.fillText(done?'簽':no?'拒':'售',sx+8,py0+6.5);
    cx.textAlign='left'; cx.textBaseline='alphabetic';
    if(st.letter&&!done){ rect(sx+11,py0+7,4,4,'#f3ead9') }
  }
}

/* 主角／NPC 像素小人 */
function drawGuy(sx,sy,dir,frame,pal){
  const p=pal||{hair:'#20242c',skin:'#e8b98d',top:'#eef2f6',bot:'#2c3442',acc:'#f6b23c'};
  const wob=frame?1:0;
  rect(sx+2,sy+11-wob,3,3,p.bot); rect(sx+7,sy+11+wob,3,3,p.bot);   // 腿
  rect(sx+2,sy+5,8,7,p.top);                                        // 身

  rect(sx+1,sy+6,2,5,p.top); rect(sx+9,sy+6,2,5,p.top);              // 手
  rect(sx+2,sy,8,6,p.skin);                                          // 頭

}

/* 小地圖 */
function drawMinimap(){
  const W=Math.round(Math.min(96,VW*0.235)), H=Math.round(W/1.38), mx=VW-W-6, my=6;
  cx.fillStyle='rgba(243,234,217,.93)'; cx.fillRect(mx-2,my-2,W+4,H+4);
  cx.strokeStyle='#6f6553'; cx.lineWidth=1; cx.strokeRect(mx-1.5,my-1.5,W+3,H+3);
  const sx=W/MW, sy=H/MH;
  cx.fillStyle='#b6ac96';
  for(let y=0;y<MH;y+=1)for(let x=0;x<MW;x+=1){
    const v=World.at(x,y); if(v===T_ROAD) cx.fillRect(mx+x*sx,my+y*sy,sx+.6,sy+.6);
  }
  for(const h of World.houses){
    if(!h.sale) continue; const st=Game.hs(h.id);
    cx.fillStyle= st.signed?'#1f8b5f':st.refused?'#8a7c72':st.seen?'#c4831f':'#7a6a44';
    cx.fillRect(mx+h.x*sx-.5,my+h.y*sy-.5,2,2);
  }
  const of=World.houses[World.officeId];
  if(of){ cx.fillStyle='#2f6ba0'; cx.fillRect(mx+of.x*sx-1,my+of.y*sy-1,3,3) }
  if(Game.nav){ const n=World.houses[Game.nav.id];
    cx.fillStyle= (Date.now()%700<350)?'#1b2330':'#d43b2d';
    cx.fillRect(mx+n.x*sx-1.5,my+n.y*sy-1.5,4,4);
  }
  cx.fillStyle='#101418';
  cx.fillRect(mx+(P.x/TS)*sx-1,my+(P.y/TS)*sy-1,3,3);
}

/* 導航箭頭 */
function drawNavArrow(){
  if(!Game.nav) return;
  const n=World.houses[Game.nav.id];
  const tx=n.x*TS+8, ty=n.y*TS+8;
  const sx=tx-Cam.x, sy=ty-Cam.y;
  if(sx>10&&sx<VW-10&&sy>10&&sy<VH-10){
    const b=Math.sin(Date.now()/220)*2;
    rect(sx-4,sy-26+b,8,3,'#d43b2d'); rect(sx-2,sy-23+b,4,4,'#d43b2d');
    return;
  }
  const dx=tx-(Cam.x+VW/2), dy=ty-(Cam.y+VH/2), a=Math.atan2(dy,dx);
  const rx=VW/2+Math.cos(a)*(VW/2-22), ry=VH/2+Math.sin(a)*(VH/2-22);
  cx.save(); cx.translate(rx,ry); cx.rotate(a);
  cx.fillStyle='#d43b2d'; cx.beginPath(); cx.moveTo(9,0); cx.lineTo(-6,-6); cx.lineTo(-6,6); cx.closePath(); cx.fill();
  cx.restore();
  const d=Math.round(Math.hypot(dx,dy)/TS);
  cx.fillStyle='#1b2330'; cx.font='900 8px "Noto Sans TC",sans-serif'; cx.textAlign='center';
  cx.fillText(d+'格',rx,ry+16); cx.textAlign='left';
}

/* 辦公室內部（固定小地圖） */
const OFFICE={w:20,h:13,map:null};
(function(){
  const m=[];
  for(let y=0;y<OFFICE.h;y++){ const row=[];
    for(let x=0;x<OFFICE.w;x++){
      let v=0;
      if(x===0||y===0||x===OFFICE.w-1||y===OFFICE.h-1) v=1;

      m.push(v); }
  }
  OFFICE.map=m;
})();
const DESKS=[[2,3],[5,3],[8,3],[11,3],[2,7],[5,7],[8,7],[11,7],[15,3],[15,7]];
function officeSolid(tx,ty){
  if(tx<0||ty<0||tx>=OFFICE.w||ty>=OFFICE.h) return true;
  const v=OFFICE.map[ty*OFFICE.w+tx];
  if(v===1) return true;
  for(const d of DESKS){ if(tx>=d[0]&&tx<=d[0]+1&&ty===d[1]) return true }
  if(tx>=15&&tx<=17&&ty===10) return true; // 店長桌
  if(tx===16&&ty===9) return true;           // 店長本人
  return false;
}

  cx.fillStyle='#1b2330'; cx.font='900 7px "Noto Sans TC",sans-serif'; cx.textAlign='center';
  cx.fillText('店長',gx+16*TS+7,gy+9*TS-3); cx.textAlign='left';

/* ── 版面：舞台永遠塞進可用空間，不出現捲軸 ── */
function fitStage(){
  const availW=$stagewrap.clientWidth, availH=$stagewrap.clientHeight;
  if(!availW||!availH) return;
  // 畫面比例跟著可用空間走：直立手機會變高，而不是留一大片空白
  let a=Math.max(0.60,Math.min(1.9,availW/availH));
  let w=availW, h=w/a;
  if(h>availH){ h=availH; w=h*a }
  w=Math.floor(w); h=Math.floor(h);
  $stage.style.width=w+'px'; $stage.style.height=h+'px';
  $stage.style.setProperty('--sw',w+'px');
  $stage.style.setProperty('--sh',h+'px');
  // 窄螢幕用較低的內部解析度，格子才不會小到看不清楚
  const lw = w<470 ? 336 : 480;
  const lh = Math.max(224,Math.min(832,Math.round(lw/a/16)*16));
  setViewport(lw,lh);
}
addEventListener('resize',fitStage);

const AI={s:null,ready:false,

    const prompt=`你是一款台灣房仲養成遊戲的裁判兼演員，扮演一位「不想簽委託」的屋主。
【屋主設定】性格：${ctx.type}（${ctx.note}）；賣屋原因：${ctx.why}；物件：${ctx.addr}，${ctx.ping} 坪；目前戒心 ${ctx.guardPct}%（越高越難搞）。
【你這一輪已經說出口的理由】${ctx.line}
${hist}【房仲的回應】${line}

你的立場：你「預設就是不簽」。你不會因為對方講一句漂亮話就妥協，也不會主動幫他找台階。
只有當對方同時做到「接住你的情緒」＋「針對你這個理由，提出一個對你零成本、今天就能執行的具體下一步」，你才會稍微鬆動；
即使鬆動，你也要再追問或再丟一個新的顧慮，不要直接答應簽約。

評分標準（請嚴格，寧可給低不要給高）：
- 85～100：非常少見。完全命中你的理由，具體、零風險、你想不出反駁。
- 65～84：有承接情緒又有具體下一步，但還有可挑剔的地方。
- 40～64：態度可以，但只是空泛的努力宣示、沒有可執行的下一步。
- 15～39：答非所問、只講自己、或又重複前面講過的話。
- 0～14：踩到地雷——貶低同業、保證賣掉、逼迫、未經同意刊登或聯絡租客、要你毀約或做假、當場叫你降價。

只輸出 JSON，不要有其他文字：
{"score":整數0-100,
 "reply":"屋主的回應（45字內，台灣口語，語氣要延續前面的對話，可以追問或再刁難）",
 "note":"對這句話的評語（25字內，直接講好在哪或壞在哪）",
 "tip":"給房仲的具體建議（30字內，下次可以怎麼講）"}`;
    return await this.s.json(prompt,{modelTier:'quick'});
  },
  async probe(ctx,line){
    const prompt=`你是一款台灣房仲養成遊戲的演員兼裁判，扮演${ctx.who}。
房仲來按門鈴要找 ${ctx.sur} 姓的屋主（他名下的 ${ctx.addr} 掛在賣）。你知道他搬去 ${ctx.known}，但你有戒心，不會隨便講。
【你剛才說】${ctx.q}
【房仲的回應】${line}

你預設不想透露。只有當對方先報清楚自己是誰、把來意講得讓你安心、而且沒有逼問地址時，你才會鬆一點。
被追問地址、被謊稱關係、或對方一開口就談生意，你會立刻收回。
第 ${ctx.round} 題（共 3 題），前兩題不要講出地址，最後一題若對方表現夠好才可以講出「${ctx.known}」。
只輸出 JSON：{"score":整數0-100,"reply":"你的回應（40字內，台灣口語）","note":"評語（25字內）","tip":"給房仲的建議（30字內）"}`;

/* ── 對話框 ── */
let talkQueue=[], talkCb=null, typeI=0, typeTimer=null, typeFull='';
function say(who,lines,cb,tag){
  $talk.classList.add('show');
  $talkWho.textContent=who; $talkTag.textContent=tag||'';
  talkQueue=Array.isArray(lines)?lines.slice():[lines];
  talkCb=cb||null; nextLine();
}
function nextLine(){
  if(!talkQueue.length){ $talk.classList.remove('show'); const c=talkCb; talkCb=null; if(c) c(); return }
  typeFull=talkQueue.shift(); typeI=0; $talkTx.innerHTML='';
  clearInterval(typeTimer);
  typeTimer=setInterval(()=>{
    typeI+=1;
    $talkTx.innerHTML=render(typeFull.slice(0,typeI));
    if(typeI%3===0) A.sfx('hover');
    if(typeI>=typeFull.length){ clearInterval(typeTimer); typeTimer=null }
  },22);
}
function render(s){ return esc(s).replace(/（([^）]*?)）/g,'<span class="nar">（$1）</span>') }
function advanceTalk(){
  if(!$talk.classList.contains('show')) return false;
  if(typeTimer){ clearInterval(typeTimer); typeTimer=null; $talkTx.innerHTML=render(typeFull); return true }
  A.sfx('click'); nextLine(); return true;
}

/* ═══ 行動點數 ═══ */
function spend(n){
  if(Game.ap<n){ A.sfx('deny'); toast('行動點數不足，今天到此為止'); return false }
  Game.ap-=n; A.sfx('ap'); hudSync();
  if(Game.ap<=0) Game.dayOver=true;
  return true;
}

function endDay(reason){
  closeOvl(); $talk.classList.remove('show'); Game.duel=null;
  if(Game.signed>=GOAL&&Game.day>=MAXDAY) return finish(true);
  A.sfx('day');
  const events=[];
  for(const L of Game.letters){
    if(L.done) continue;
    if(Math.random()<0.02){
      L.done=true;
      const pool=World.houses.filter(h=>h.id!==L.house);
      events.push({house:L.house,meet:pool[Math.floor(Math.random()*pool.length)].id});
    }
  }
  Game.day++;
  if(Game.day>MAXDAY) return finish(Game.signed>=GOAL);
  Game.ap=AP_DAY; Game.dayOver=false;
  // 新的一天：一律回公司出發
  Game.scene='office'; P.x=9.5*TS; P.y=(OFFICE.h-3)*TS; P.dir=0;
  A.play('office'); hudSync(); setActs(); save(true);
  const lines=[`（${reason}。你回公司打完日報，關燈，隔天一早——）`,
    `DAY ${Game.day} ／ ${MAXDAY}　行動點數回滿 100 點。目前委託 ${Game.signed} / ${GOAL} 件。`,
    '（你在公司的座位上把資料夾收好，準備出門跑街。）'];
  if(events.length){
    const ev=events[0];
    const src=World.houses[ev.house], mt=World.houses[ev.meet], d=World.deed(src);
    lines.push('（桌上的手機響了。）');
    lines.push(`「喂？請問是${Game.name}嗎？我是${src.addr.full}那間的屋主，姓${d.ownerSur}。你之前有留一張紙在我門口……」`);
    lines.push(`「我最近剛好在想這件事。你要不要過來一趟？我人在 ${mt.addr.full}，你來我們當面講。」`);
    Game.nav={id:ev.meet,kind:'meet',src:ev.house,label:'約訪：'+mt.addr.full};
    addLog(`開發信奏效！${d.ownerSur}姓屋主來電，約在 ${mt.addr.full}`,'l-good');
    A.sfx('phone');
  }
  say('　',lines,()=>setActs(),`DAY ${Game.day}`);
}

const FIREBASE={ apiKey:'AIzaSyAUbp8KWE5mquSNX9M4j3oumauTjZo1xKU', projectId:'fangzhong-rpg', collection:'leaderboard' };
const BOARD_KEY='fangzhong_rpg_board_v1';
const boardOn=()=>!!(FIREBASE.apiKey&&FIREBASE.projectId);

function boardLocal(){ try{ return JSON.parse(localStorage.getItem(BOARD_KEY)||'[]') }catch(e){ return [] } }
function boardSaveLocal(list){ try{ localStorage.setItem(BOARD_KEY,JSON.stringify(list.slice(0,100))) }catch(e){} }

async function boardSubmit(entry){
  const list=boardLocal(); list.push(entry);
  list.sort((a,b)=>a.days-b.days||b.signed-a.signed||a.ts-b.ts);
  boardSaveLocal(list);
  if(!boardOn()) return;
  try{
    await fetch(`https://firestore.googleapis.com/v1/projects/${FIREBASE.projectId}/databases/(default)/documents/${FIREBASE.collection}?key=${FIREBASE.apiKey}`,
      {method:'POST',headers:{'Content-Type':'application/json'},
       body:JSON.stringify({fields:{
         name:{stringValue:String(entry.name).slice(0,12)},
         days:{integerValue:String(entry.days)},
         signed:{integerValue:String(entry.signed)},
         ts:{integerValue:String(entry.ts)}}})});
  }catch(e){}
}
async function boardFetch(){
  const local=boardLocal().map(e=>({...e,mine:true}));
  if(!boardOn()) return {rows:local,shared:false};
  try{
    const r=await fetch(`https://firestore.googleapis.com/v1/projects/${FIREBASE.projectId}/databases/(default)/documents/${FIREBASE.collection}?key=${FIREBASE.apiKey}&pageSize=300`);
    if(!r.ok) throw 0;
    const j=await r.json();
    const rows=(j.documents||[]).map(d=>({
      name:(d.fields.name||{}).stringValue||'—',
      days:+((d.fields.days||{}).integerValue||99),
      signed:+((d.fields.signed||{}).integerValue||0),
      ts:+((d.fields.ts||{}).integerValue||0)}));
    return {rows,shared:true};
  }catch(e){ return {rows:local,shared:false,err:true} }
}

    const box=el('bdBody'); if(!box) return;
    rows.sort((a,b)=>a.days-b.days||b.signed-a.signed||a.ts-b.ts);

/* ── 店長：每次都不一樣 ── */
function bossTalk(){
  let pool;
  if(Game.signed>=GOAL) pool=BOSS_LINES.done;
  else if(Game.day<=2) pool=BOSS_LINES.start.concat(BOSS_LINES.early);
  else{
    const pace=Game.signed/Math.max(1,GOAL*(Game.day/MAXDAY));
    if(Game.day>=20&&Game.signed<GOAL-1) pool=BOSS_LINES.behind;
    else if(pace>=1.1) pool=BOSS_LINES.ahead.concat(BOSS_LINES.mid);
    else pool=BOSS_LINES.mid.concat(BOSS_LINES.early);
  }
  let i=Math.floor(Math.random()*pool.length);
  if(pool.length>1&&i===Game.lastBoss) i=(i+1)%pool.length;
  Game.lastBoss=i;
  const head= Game.signed>=GOAL ? [] :
    [`「目前 ${Game.signed} 件，還差 ${GOAL-Game.signed} 件，剩 ${Math.max(0,MAXDAY-Game.day+1)} 天。」`];
  say('店長',head.concat(pool[i]),()=>{},'FREE');
}

/* ═══ 互動 ═══ */
function interact(){
  if(advanceTalk()) return;
  if($ovl.classList.contains('show')) return;
  if(Game.scene==='office'){
    if(Math.hypot(P.x-(16*TS+6),P.y-(9*TS+6))<40){ A.sfx('click'); bossTalk() }
    return;
  }
  if(Game.scene!=='city') return;
  const d=P.dir, tx=Math.floor((P.x+8)/TS)+(d===1?1:d===3?-1:0), ty=Math.floor((P.y+8)/TS)+(d===2?1:d===0?-1:0);
  let h=World.house(tx,ty);
  if(!h) for(const [ax,ay] of [[0,1],[0,-1],[1,0],[-1,0]]){ h=World.house(tx+ax,ty+ay); if(h) break }
  if(!h){ A.sfx('cancel'); return }
  if(h.office){ A.sfx('door'); toOffice(); return }
  if(Game.nav&&Game.nav.id===h.id){ arriveTarget(h); return }
  if(h.sale){ A.sfx('click'); saleHouse(h); return }
  A.sfx('cancel'); toast('這裡沒什麼特別的');
}

  closeOvl(); if(Game.scene==='city') A.play('city');
  say('　',['（你把開發信折好，塞進門縫。）',

    '（會不會有回音，只能等。）'],()=>setActs());

/* ═══ 抵達導航目標 ═══ */
function arriveTarget(h){
  const nav=Game.nav, src=World.houses[nav.src], d=World.deed(src);
  if(nav.kind==='meet'){
    if(!spend(AP_TALK)) return;
    Game.nav=null; setActs();
    say('　',[`（你到了 ${h.addr.full}。）`,`（${d.ownerSur}先生／小姐已經在門口等你了。這次是他找你來的。）`],
      ()=>startDuel('owner',src,h,-18));
    return;
  }
  if(nav.kind==='clue'){
    if(!spend(AP_TALK)) return;
    Game.nav=null; setActs();
    const r=rngFor(Game.seed,'clue'+h.id+Game.day);
    if(h.bt==='tower'){
      A.sfx('guard');
      say('管理員',[`（${h.addr.full}。這裡也是大樓，一樣要先過警衛室。）`,'「你找哪一戶？有沒有跟住戶約？」'],
        ()=>startDuel('guard',src,h,0));
      return;
    }
    if(r()<.8) say('　',[`（你按了 ${h.addr.full} 的電鈴。）`,'（門開了。是他。）'],()=>knockOwner(src,h));
    else say('　',['（門沒開。窗簾動了一下，然後沒有然後了。）'],()=>offerLetter(src,'撲空'));
    return;
  }
  if(!spend(AP_TALK)) return;
  const st=Game.hs(src.id); st.visits=(st.visits||0)+1;
  Game.nav=null; setActs();
  const r=rngFor(Game.seed,'enc'+src.id+'#'+st.visits+'#'+Game.day);
  const addr=h.addr.full;
  if(h.bt==='tower'){          // 電梯大樓一定有管理員，來幾次都一樣
    A.sfx('guard');
    const gw=Game.hs(h.id).guardWins||0;
    say('管理員',[`（${addr} 是一棟有電梯的大樓，一樓有警衛室。）`,
      gw ? '（同一個管理員。他認得你了，但還是把窗戶拉開。）' : '（你一走進大廳，警衛室的窗戶就開了。）',
      gw ? '「又是你喔？今天找哪一戶？」' : '「先生，你找哪一戶？」'],
      ()=>startDuel('guard',src,h,0));
    return;
  }
  const roll=Math.floor(r()*6);
  switch(roll){
    case 0:
      A.sfx('door');
      say('　',[`（你按了 ${addr} 的門鈴。）`,`（腳步聲。門開了一條縫，一位${d.ownerSur}姓的屋主探出頭。）`],
        ()=>knockOwner(src,h));
      break;
    case 1:
      say('　',[`（${addr}。你按了三次電鈴，沒有人應。）`,'（信箱有點滿，但不是很滿——最近幾天有人回來過。）'],
        ()=>offerLetter(src,'屋主不在家'));
      break;
    case 2:
      say('　',[`（${addr}。開門的是一位年紀比較大的太太，看起來不是${d.ownerSur}姓的。）`],
        ()=>probeGame(src,h));
      break;
    case 3:
      say('　',[`（${addr}。開門的是一個年輕人，手上還拿著外送。）`,
        `「${d.ownerSur}？沒聽過欸，我們租這裡兩年了。」`,'「房東姓什麼我也不知道，都是匯款的。」'],
        ()=>offerLetter(src,'查無此人'));
      break;
    case 4:{
      const know=r()<.5;
      const pool=World.houses.filter(o=>o.id!==h.id&&o.id!==src.id);
      const nx=pool[Math.floor(r()*pool.length)];
      if(know){
        say('隔壁鄰居',[`（${addr} 沒人應門。你正要走，隔壁的門開了。）`,'「你找隔壁的喔？他早就搬走了啦。」',
          `「他現在住在 ${nx.addr.full}，我上禮拜還在市場遇到他。」`],
          ()=>{
            Game.nav={id:nx.id,kind:'clue',src:src.id,label:'線索：'+nx.addr.full};
            addLog('鄰居提供線索：屋主現住 '+nx.addr.full,'l-good');
            A.sfx('good'); setActs(); offerLetter(src,'順便留一封');
          });
      }else{
        say('隔壁鄰居',[`（${addr} 沒人應門。隔壁的阿伯正在洗機車。）`,'「隔壁喔？我也不太認識欸，他很少回來。」',
          '「你要留東西的話，塞門縫他有時候會看啦。」'],()=>offerLetter(src,'鄰居不清楚'));
      }
      break;
    }
    default:
      say('　',[`（${addr}。鐵門拉下來了，信箱塞了兩張水電通知。）`,
        '（隔壁的阿姨從窗戶看你一眼，把窗戶關上。）'],
        ()=>offerLetter(src,'大門深鎖'));
  }
}

/* ── 閉門羹：難纏的屋主要跑好幾趟 ── */
function knockOwner(src,here){
  const st=Game.hs(src.id), d=World.deed(src);
  if(st.knocks<d.cold){
    const sc=COLD_SCENES[Math.min(COLD_SCENES.length-1, st.knocks*2+Math.floor(Math.random()*2))];
    st.knocks++;
    A.sfx('deny');
    addLog(`在 ${src.addr.full} 吃了閉門羹（第 ${st.knocks} 次）`,'l-bad');
    const left=d.cold-st.knocks;
    say('　',sc.t.concat([`（${sc.n}）`]),()=>{
      card('吃了閉門羹','第 '+st.knocks+' 次',
        `<div class="say nar">${esc(sc.n)}<br><br>${left>0
          ? '他還沒把你當一回事。再跑幾趟，他遲早要面對你。'
          : '不過他這次多看了你一眼——下次來，他大概躲不掉了。'}
         <br><br><b style="color:var(--jade)">每跑一趟，他的戒心就低一點。</b></div>`,
        [{key:'✉',label:'留一封開發信再走',disabled:st.letter,fn:()=>{
            st.letter=true; Game.letters.push({house:src.id,day:Game.day,done:false});
            A.sfx('stamp'); addLog('留下開發信'); closeOvl(); setActs(); toast('開發信已留下')}},
         {key:'✕',label:'離開',fn:()=>{A.sfx('cancel');closeOvl();setActs()}}]);
    });
    return;
  }
  if(st.knocks>0){
    say('　',COLD_BREAK,()=>startDuel('owner',src,here,0));
  }else{
    say('　',['「找誰？」'],()=>startDuel('owner',src,here,0));
  }
}

function offerLetter(src,why){
  const st=Game.hs(src.id);
  card(why,'現場',
    `<div class="say nar">${esc(World.houses[src.id].addr.full)} 這間的屋主，今天沒有見到。<br>你手上還有幾張開發信。</div>`,
    [{key:'✉',label:'留一封開發信',sub:st.letter?'這間已經留過了':'每天 2% 機率接到屋主來電',disabled:st.letter,
      fn:()=>{ st.letter=true; Game.letters.push({house:src.id,day:Game.day,done:false});
        A.sfx('stamp'); addLog('在 '+World.houses[src.id].addr.full+' 的線索處留下開發信');
        closeOvl(); if(Game.scene==='city')A.play('city'); setActs(); toast('開發信已留下') }},
     {key:'✕',label:'先離開',fn:()=>{A.sfx('cancel');closeOvl();if(Game.scene==='city')A.play('city');setActs()}}]);
}

/* ═══ 套話：自由作答 ═══ */
function probeGame(src,here){
  const d=World.deed(src);
  let round=0, hits=0, said=[];
  const pool=World.houses.filter(o=>o.id!==here.id&&o.id!==src.id);
  const nx=pool[Math.floor(rngFor(Game.seed,'px'+src.id)()*pool.length)];

  const finishProbe=()=>{
    if(hits>=2){
      A.sfx('good');
      Game.nav={id:nx.id,kind:'clue',src:src.id,label:'線索：'+nx.addr.full};
      addLog('套話成功：屋主人在 '+nx.addr.full,'l-good');
      card('套出線索了','CLUE',
        `<div class="say">「他現在住在 <b style="color:var(--amber)">${esc(nx.addr.full)}</b> 那邊啦，你去那裡找他。」</div>
         <div class="say nar">你把地址記在手機備忘錄裡。導航已經設定好了。</div>`,
        [{key:'▶',label:'出發',fn:()=>{A.sfx('confirm');closeOvl();A.play('city');setActs()}}]);
    }else{
      A.sfx('bad');
      card('套不出來','FAIL',`<div class="say">「歹勢啦，我真的不方便講。」（門關上了。）</div>`,
        [{key:'✉',label:'在門口留一封開發信',disabled:Game.hs(src.id).letter,fn:()=>{
            const st=Game.hs(src.id); st.letter=true; Game.letters.push({house:src.id,day:Game.day,done:false});
            A.sfx('stamp'); addLog('留下開發信'); closeOvl(); A.play('city'); setActs(); toast('開發信已留下')}},
         {key:'✕',label:'離開',fn:()=>{A.sfx('cancel');closeOvl();A.play('city');setActs()}}]);
    }
  };

  const step=()=>{
    if(round>=PROBE_Q.length) return finishProbe();
    const Q=PROBE_Q[round];
    freeformPanel({
      title:'套話中', tag:'第 '+(round+1)+' / '+PROBE_Q.length+' 題',
      who:'開門的人', line:Q.q.replace('{S}',d.ownerSur),
      bars:`<div class="gauge"><b>套出線索　${hits} / 2</b><div class="bar rap"><i style="width:${hits/2*100}%"></i></div></div>`,
      placeholder:'你要怎麼開口？',
      onSend:async (text,ui)=>{
        said.push(text);
        let r;
        if(AI.ready){
          ui.thinking('對方正在想⋯⋯');
          try{
            const j=await AI.probe({who:'一位年紀比較大的鄰居／同住者',sur:d.ownerSur,
              addr:src.addr.full,q:Q.q.replace('{S}',d.ownerSur),known:nx.addr.full,round:round+1},text);
            const sc=Math.max(0,Math.min(100,Math.round(j.score||0)));
            r={ok:sc>=55,score:sc,reply:j.reply,note:j.note||'',tip:j.tip||Q.tip};
          }catch(e){ r=null }
        }
        if(!r){
          const lr=probeScore(round,text);
          r={ok:lr.ok,score:lr.score,note:lr.note,tip:lr.tip,
             reply:(lr.ok?Q.ok:Q.no).replace('{ADDR}',nx.addr.full)};
        }
        if(r.ok) hits++;
        A.sfx(r.ok?'good':'guard');
        resultCard({
          title:r.ok?'有進展':'碰壁了', tagText:'評分 '+r.score,
          tagColor:r.ok?'var(--jade)':'var(--red)',
          me:text, reply:(r.reply||'').replace('{ADDR}',nx.addr.full),
          note:r.note, tip:r.tip,
          nextLabel:'繼續', onNext:()=>{ round++; step() }
        });
      }
    });
  };
  step();
}

/* ═══ 自由對話面板（屋主／管理員／套話共用） ═══════════════ */
function freeformPanel(o){
  const opts=o.opts||null;
  const optHtml = opts
    ? `<div class="choices tight" id="ffOpts">`+opts.map((op,k)=>
        `<button class="ch" data-i="${k}"><span class="k">${'ABCD'[k]}</span><span>${esc(op.t)}</span></button>`).join('')
      +`</div><div class="orline"><span>或者，自己想一句</span></div>`
    : '';
  $ovlIn.innerHTML=`<div class="card"><div class="card-hd"><h3>${o.title}</h3>
      ${o.tag?`<span class="tag">${o.tag}</span>`:''}</div>
    <div class="card-bd"><div class="duel">
      ${o.bars||''}
      ${o.intro?`<div class="say nar">${esc(o.intro)}</div>`:''}
      <div class="say"><b>${esc(o.who)}</b>${esc(o.line)}</div>
      ${optHtml}
      <div class="ffwrap">
        <textarea id="ffIn" rows="2" maxlength="120" placeholder="${o.placeholder||'輸入你要跟他說的話⋯⋯'}"></textarea>
        <button class="ffgo" id="ffGo">說出口</button>
      </div>
      <div class="coach" id="ffMsg">${o.hint || (opts
        ? '四句聽起來都像行話，但只有一句真的解得開他這一題。也可以不選，自己打一句。'
        : (AI.ready
          ? '自己想一句話回他。對方會照你講的內容反應，下面會給你評語與建議。'
          : '自己想一句話回他。系統會依房仲實務評分，下面會給你評語與建議。'))}</div>
    </div></div></div>`;
  $ovl.classList.add('show'); $ovl.scrollTop=0;
  const inp=el('ffIn'), go=el('ffGo'), msg=el('ffMsg');
  let busy=false;
  const lock=()=>{ go.disabled=true; inp.disabled=true;
    if(opts) el('ffOpts').querySelectorAll('.ch').forEach(b=>b.disabled=true) };
  const ui={
    thinking(t){ msg.className='coach think'; msg.textContent=t;
      let d=0; ui._tk=setInterval(()=>{d=(d+1)%4; msg.textContent=t+'．'.repeat(d)},380) },
    stop(){ clearInterval(ui._tk) },
    error(t){ ui.stop(); msg.className='coach warn'; msg.textContent=t; busy=false;
      go.disabled=false; inp.disabled=false;
      if(opts) el('ffOpts').querySelectorAll('.ch').forEach(b=>b.disabled=false) }
  };
  const fire=async()=>{
    if(busy) return;
    const v=(inp.value||'').trim();
    if(v.length<4){ msg.className='coach warn'; msg.textContent='再多說一點，對方聽不出你要表達什麼。'; A.sfx('deny'); return }
    busy=true; lock(); A.sfx('click');
    try{ await o.onSend(v,ui) }catch(e){ ui.error('出了一點狀況，請再說一次。') }
    finally{ ui.stop() }
  };
  go.onclick=fire;
  if(opts) el('ffOpts').querySelectorAll('.ch').forEach(b=>{
    b.onclick=()=>{ if(busy) return; busy=true; lock(); A.sfx('click'); o.onPick(+b.dataset.i,ui) };
  });
  // Enter 不送出（換行用 Shift+Enter，一般 Enter 也只是換行）
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey) e.stopPropagation() });
  setTimeout(()=>{ try{ inp.focus() }catch(e){} },80);
}

function resultCard(o){
  $ovlIn.innerHTML=`<div class="card"><div class="card-hd"><h3>${o.title}</h3>
      <span class="tag" style="background:${o.tagColor};color:#0d1117">${o.tagText}</span></div>
    <div class="card-bd"><div class="duel">
      ${o.bars||''}
      <div class="say me"><b>${esc(Game.name)}</b>${esc(o.me)}</div>
      <div class="say">${esc(o.reply||'「⋯⋯」')}</div>
      <div class="coach">${o.note?`<span class="cl">評語</span>${esc(o.note)}`:''}
        ${o.tip?`<br><span class="cl tipc">建議</span>${esc(o.tip)}`:''}</div>
      <div class="choices" id="nx"></div>
    </div></div></div>`;
  $ovl.scrollTop=0;
  const b=document.createElement('button'); b.className='ch';
