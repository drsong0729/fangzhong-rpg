/* ═══ 攻防戰 ═══════════════════════════════════════════════ */
function startDuel(kind,src,here,bonus){
  const d=World.deed(src), st=Game.hs(src.id);
  const moves = kind==='guard'
    ? shuffled(rngFor(Game.seed,'gd'+here.id),GUARD_MOVES).slice(0,4)
    : d.moves;
  let maxG;
  if(kind==='guard'){
    const gw=Game.hs(here.id).guardWins||0;
    maxG=Math.max(44,84-16*gw);
  }
  else{
    maxG = d.guard*0.9 - 8*(st.knocks||0) - (st.letter?8:0) - 11*(st.tries||0) + (bonus||0);
    maxG = Math.max(52,Math.round(maxG*1.12));
  }
  if(kind==='owner') st.tries=(st.tries||0)+1;
  Game.duel={kind,src,here,d,moves,i:0,g:maxG,maxG,rap:100,history:[],said:[],
    steel:false,final:null,finalDone:(kind!=='owner'),seq:0};
  A.play('battle'); A.sfx('guard');
  duelTurn(kind==='guard'
    ? '（警衛室的燈很亮。管理員上下打量你。）'
    : (st.tries>1 ? `（第 ${st.tries} 次了。他站在門口，這次沒有馬上關門。）`
                  : '（他一手還扶著門，隨時可以關上。）'));
}
function duelWho(D){ return D.kind==='guard' ? '管理員' : D.d.ownerName+' 屋主' }
function duelBars(D){
  return `<div class="duel-top">
    <div class="gauge"><b>${esc(duelWho(D))}　戒心 GUARD</b>
      <div class="bar guard"><i style="width:${Math.max(0,Math.min(100,D.g/D.maxG*100))}%"></i></div>
      <u>${D.kind==='guard'?'不透露住戶資訊':esc(D.d.type.n+'　'+D.d.type.note)}</u></div>
    <div class="gauge"><b>${esc(Game.name)}　耐心 PATIENCE</b>
      <div class="bar rap"><i style="width:${Math.max(0,D.rap)}%"></i></div>
      <u>被討厭到底就會被請出去</u></div>
  </div>`;
}

/* 四個回話選項：正解／近似解／兩個似是而非，順序打亂 */
function duelOptions(D,mv){
  const list=[Object.assign({k:'good'},mv.good),Object.assign({k:'ok'},mv.ok)]
    .concat((mv.bad||[]).map(x=>Object.assign({k:'bad'},x)));
  const r=rngFor(Game.seed,'opt'+(D.src?D.src.id:0)+'_'+mv.id+'_'+(D.seq||0));
  return shuffled(r,list).slice(0,4);
}

function duelTurn(intro){
  const D=Game.duel; if(!D) return;

  // 最後一問：戒心快破時，他還會再考你一題
  if(D.kind==='owner' && !D.final && !D.finalDone && D.g<=D.maxG*0.30){
    const fr=rngFor(Game.seed,'fin'+D.src.id+'_'+(D.d.tries||0));
    D.final=FINAL_MOVES[Math.floor(fr()*FINAL_MOVES.length)];
    D.g=Math.max(D.g,Math.round(D.maxG*0.26));
  }

  if(!D.final){
    if(D.i>=D.moves.length) return duelEnd(false);   // 講完還沒鬆口＝沒談成
    if(D.i>=1) D.g=Math.min(D.maxG,D.g+4);           // 他一邊聽一邊想新理由
  }

  const mv = D.final || D.moves[D.i];
  const line = D.final ? mv.line : (D.i===0 ? mv.line : (mv.follow||mv.line));
  D.seq=(D.seq||0)+1;
  if(!D.history.length||D.history[D.history.length-1].t!==line){
    D.history.push({who:'o',t:line}); if(D.history.length>8) D.history.shift();
  }
  const opts=duelOptions(D,mv);
  D.opts=opts; D.mv=mv;
  const steelNote = D.steel
    ? '他剛剛被你惹到了，這一句要先把場子拉回來，講什麼都比平常難進去。'
    : (D.final?'這是他最後一道題。答得漂亮他就簽，答壞了前面全部要重來。':null);
  freeformPanel({
    title: D.final?'最後一問' : (D.kind==='guard'?'管理員關卡':'屋主攻防戰'),
    tag: D.final?'決勝題' : ('第 '+(D.i+1)+' / '+D.moves.length+' 回合'),
    who: duelWho(D), line, intro, bars: duelBars(D),
    placeholder:'你要怎麼回他？',
    hint: steelNote,
    opts: opts.map(o=>({t:o.t})),
    onPick: (k,ui)=>duelPick(opts[k],ui),
    onSend: (text,ui)=>duelAnswer(text,ui)
  });
}

/* 共用結算：選項與自由輸入都走這裡 */
function duelSettle(text,R){
  const D=Game.duel;
  let dmg = (R.d!=null) ? Math.max(0,Math.round(R.d*0.75))
                        : Math.round(Math.max(0,R.score-20)*0.38);
  if(D.steel){ dmg=Math.round(dmg*0.45); }
  const rap = (R.rap!=null) ? R.rap
            : (R.score<35 ? Math.round((35-R.score)*1.05) : 0);

  D.said.push(text);
  D.history.push({who:'p',t:text});
  D.history.push({who:'o',t:R.reply||'……'});
  if(D.history.length>8) D.history=D.history.slice(-8);

  const wasSteel=D.steel;
  D.steel = R.score<45;               // 講差了→他硬起來，下一句先扣半

  D.g-=dmg; D.rap-=rap;

  let win=false, lose=D.rap<=0, bounce=false;
  if(D.final){
    if(R.score>=62){ win=true; D.g=0 }
    else{ bounce=true; D.finalDone=true; D.final=null;
          D.g=Math.round(D.maxG*0.52); D.steel=true;
          // 被打回去之後還有機會，但要重新把他磨下來
          const er=rngFor(Game.seed,'ext'+D.src.id);
          const used=D.moves.map(m=>m.id);
          const extra=shuffled(er,MOVES.filter(m=>used.indexOf(m.id)<0)).slice(0,3);
          D.moves=D.moves.concat(extra); }
  }else{
    if(D.kind==='owner' && !D.finalDone){
      D.g=Math.max(D.g,Math.round(D.maxG*0.26));   // 沒過最後一問前不會直接破
      win=false;
    }else win = D.g<=0;
  }
  if(win) D.g=0;

  if(dmg>=18) A.sfx('good'); else if(dmg>0) A.sfx('hit'); else A.sfx('bad');

  let title = bounce ? '他退回去了'
            : win ? '他把筆拿起來了'
            : dmg>=18 ? '說到他心裡了'
            : dmg>=8 ? '有一點推進'
            : dmg>0 ? '幾乎沒有作用' : '講錯話了';
  let note = R.note||'';
  if(bounce) note = (note?note+' ':'') + '最後一題沒答好，他前面鬆掉的戒心又全部收回去了。';
  else if(wasSteel && dmg>0) note = (note?note+' ':'') + '（他還在氣頭上，這一句只發揮了一半效果。）';
  else if(D.steel && !win) note = (note?note+' ':'') + '（他硬起來了，下一句先把他的火降下來，不然講什麼都進不去。）';

  resultCard({
    title, tagText:'評分 '+R.score+'　戒心 −'+dmg+(rap?'　耐心 −'+rap:''),
    tagColor: bounce?'var(--red)':dmg>=18?'var(--jade)':dmg>0?'var(--amber)':'var(--red)',
    bars:duelBars(D), me:text, reply:R.reply, note, tip:R.tip,
    nextLabel: win?'⋯⋯他把筆拿起來了' : lose?'⋯⋯門關上了' : bounce?'再來一次':'繼續',
    onNext:()=>{ if(win) return duelEnd(true); if(lose) return duelEnd(false);
                 if(!bounce) D.i++; duelTurn(null) }
  });
}

/* 玩家選了其中一個回法 */
function duelPick(o,ui){
  const D=Game.duel, mv=D.mv;
  const score = o.k==='good' ? 84 : o.k==='ok' ? 48 : 16;
  const tip = (MOVE_HINTS[mv.id]||{}).tip || '';
  duelSettle(o.t,{
    score, d:o.d, rap:o.rap!=null?o.rap:(o.k==='bad'?12:0),
    reply:o.r||'「⋯⋯」',
    note:o.w || (o.k==='good' ? '這一句正好戳到他真正在意的地方——他沒有話回你。' : ''),
    tip
  });
}

async function duelAnswer(text,ui){
  const D=Game.duel, mv=D.mv||D.moves[D.i];
  const line = D.final ? mv.line : (D.i===0 ? mv.line : (mv.follow||mv.line));
  let R=null;
  if(AI.ready){
    ui.thinking(D.kind==='guard'?'管理員正在想⋯⋯':'屋主正在想⋯⋯');
    try{
      const j=await AI.judge({
        type:D.kind==='guard'?'大樓管理員（職責是不透露住戶資訊）':D.d.type.n,
        note:D.kind==='guard'?'照規定辦事、怕被住戶投訴':D.d.type.note,
        why:D.kind==='guard'?'（無）':D.d.why,
        addr:D.src.addr.full, ping:D.d.ping.toFixed(1), line,
        guardPct:Math.round(D.g/D.maxG*100), history:D.history.slice(0,-1)
      },text);
      const sc=Math.max(0,Math.min(100,Math.round(j.score||0)));
      R={score:sc,reply:j.reply,note:j.note||'',tip:j.tip||(MOVE_HINTS[mv.id]||{}).tip||''};
    }catch(e){ R=null }
  }
  if(!R){
    const lr=coachScore(mv.id,text,D.said);
    R={score:lr.score,note:lr.note,tip:lr.tip,
       reply:coachReply(mv,lr.band,D.kind==='guard')};
  }
  duelSettle(text,R);
}

function duelEnd(win){
  const D=Game.duel, st=Game.hs(D.src.id);
  Game.duel=null; A.play('city');
  if(D.kind==='guard'){
    if(win){
      A.sfx('good');
      const gs=Game.hs(D.here.id); gs.guardWins=(gs.guardWins||0)+1;
      const r=rngFor(Game.seed,'gw'+D.here.id+Game.day);
      if(r()<.55){
        card('管理員鬆口了','BREAK',
          `<div class="say">「⋯⋯好啦。那一戶的先生其實已經沒住這了。」<br>「不過他常常回來拿信，你今天運氣不錯，他人在裡面。我幫你叫。」</div>`,
          [{key:'▶',label:'等他下來',fn:()=>{A.sfx('confirm');closeOvl();knockOwner(D.src,D.here)}}]);
      }else{
        const pool=World.houses.filter(o=>o.id!==D.here.id&&o.id!==D.src.id);
        const nx=pool[Math.floor(r()*pool.length)];
        Game.nav={id:nx.id,kind:'clue',src:D.src.id,label:'線索：'+nx.addr.full};
        addLog('管理員透露屋主現住 '+nx.addr.full,'l-good');
        card('管理員鬆口了','BREAK',
          `<div class="say">「他搬去 <b style="color:var(--amber)">${esc(nx.addr.full)}</b> 了，你去那邊找。」<br>「不要說是我講的喔。」</div>`,
          [{key:'▶',label:'記下來',fn:()=>{A.sfx('confirm');closeOvl();setActs()}}]);
      }
    }else{
      A.sfx('fail');
      const canLetter=rngFor(Game.seed,'gl'+D.here.id)()<.5 && !st.letter;
      card('被請出去了','FAIL',
        `<div class="say">「先生，我最後講一次，請你出去。」（管理員站起來，你只好退到門外。）</div>`,
        canLetter
          ? [{key:'✉',label:'把開發信投進大樓信箱',fn:()=>{st.letter=true;Game.letters.push({house:D.src.id,day:Game.day,done:false});
               A.sfx('stamp');addLog('把開發信投進大樓信箱');closeOvl();setActs();toast('開發信已投遞')}},
             {key:'✕',label:'離開',fn:()=>{A.sfx('cancel');closeOvl();setActs()}}]
          : [{key:'✕',label:'離開',sub:'這棟連信都不給留',fn:()=>{A.sfx('cancel');closeOvl();setActs()}}]);
    }
    return;
  }
  if(win){
    st.signed=true; Game.signed++; hudSync(); A.sfx('sign');
    if(Game.signed===GOAL&&!Game.doneDay) Game.doneDay=Game.day;
    addLog('簽下委託！'+D.src.addr.full,'l-good'); save(true);
    card('委託書簽下來了','＋1 件',
      `<div class="say me"><b>${esc(D.d.ownerName)}</b>「⋯⋯筆給我。」</div>
       <div class="say nar">你把一般委託銷售契約書攤平在門口的鞋櫃上。他簽名的時候手有點抖，你也是。<br><br>
         <b style="color:var(--amber)">${esc(D.src.addr.full)}</b>　${D.d.ping.toFixed(2)} 坪<br>
         委託期間 30 天　一般委託${st.tries>1?'<br>你總共來了 '+st.tries+' 次。':''}</div>
       <div class="say" style="border-left-color:var(--jade)">本月委託數：<b style="color:var(--jade)">${Game.signed} / ${GOAL}</b></div>`,
      [{key:'▶',label:'收好委託書',fn:()=>{
        A.sfx('confirm'); closeOvl(); setActs();
        if(Game.signed===GOAL) setTimeout(goalReached,400);
      }}]);
  }else{
    st.refused=true; A.sfx('fail');
    addLog('被 '+D.d.ownerSur+'姓屋主拒絕了','l-bad');
    card('被拒絕了','FAIL',
      `<div class="say">「你回去吧。」（門關上，你站在原地聽見裡面上鎖的聲音。）</div>
       <div class="say nar">明天還可以再來。<b style="color:var(--jade)">你談過一次，他下次的戒心會比較低。</b><br>
       屋主不會記得你講錯的那句，但你會。</div>`,
      [{key:'✉',label:'留一封開發信再走',disabled:st.letter,fn:()=>{
          st.letter=true;Game.letters.push({house:D.src.id,day:Game.day,done:false});
          A.sfx('stamp');addLog('留下開發信');closeOvl();setActs();toast('開發信已留下')}},
       {key:'✕',label:'離開',fn:()=>{A.sfx('cancel');closeOvl();setActs()}}]);
  }
}

function goalReached(){
  card('目標達成','6 / 6',
    `<div class="say" style="border-left-color:var(--jade)">六件委託到手，第 ${Game.doneDay||Game.day} 天。店長在電話那頭沉默了三秒，然後說：「回來。」</div>
     <div class="say nar">現在回公司結算，成績會登上排行榜（天數越少越前面）。也可以繼續跑完這個月——委託可以超過六件。</div>`,
    [{key:'▶',label:'現在回公司結算',sub:'以第 '+(Game.doneDay||Game.day)+' 天登記成績',fn:()=>{A.sfx('confirm');closeOvl();finish(true)}},
     {key:'▷',label:'繼續衝業績',sub:'排行榜天數仍以第 '+(Game.doneDay||Game.day)+' 天計算',fn:()=>{A.sfx('click');closeOvl();setActs()}}]);
}

/* ═══ 結算 ═══ */
const END_LINES=['房仲這份工作不只是出一張嘴','還要有強大的毅力與抗壓力','這只是一款遊戲',
  '現實會比這個更辛苦','如果你想挑戰自己、獲取無上限的薪水','歡迎加入日勝國際不動產！','歡迎致電：0755-777-88'];
function finish(win){
  Game.scene='ending'; Game.duel=null; closeOvl(); $talk.classList.remove('show'); $acts.innerHTML='';
  A.play(win?'win':'lose'); A.sfx(win?'sign':'fail');
  if(win&&Game.signed>=GOAL){
    boardSubmit({name:Game.name||'菜鳥',days:Math.min(MAXDAY,Game.doneDay||Game.day),
      signed:Game.signed,ts:Date.now()});
  }
  const seen=Object.values(Game.hstate).filter(s=>s.seen).length;
  const knocks=Object.values(Game.hstate).reduce((a,s)=>a+(s.knocks||0)+(s.tries||0),0);
  $ovlIn.innerHTML=`<div class="ending">
    <div class="verdict${win?'':' bad'}">${win?'恭喜通關':'GAME OVER'}</div>
    <div class="score">經紀營業員　${esc(Game.name)}<br>
      委託成交　${Game.signed} / ${GOAL} 件　·　天數 ${Math.min(Game.day,MAXDAY)} / ${MAXDAY}<br>
      調閱謄本 ${seen} 件　·　開發信 ${Game.letters.length} 封　·　敲門 ${knocks} 次</div>
    <div class="lines" id="endLines">${END_LINES.map((l,i)=>
      `<p class="${i>=4?(i===6?'tel':'hi'):''}">${esc(l)}</p>`).join('')}</div>
    <div class="choices">
      <button class="ch" id="endAgain" style="justify-content:center;background:var(--amber);color:#22190a;border-color:#ffd889;font-weight:900"><span>再玩一次</span></button>
      <button class="ch" id="endBoard" style="justify-content:center"><span>看排行榜</span></button>
      <button class="ch" id="endTitle" style="justify-content:center"><span>回主畫面</span></button>
    </div></div>`;
  $ovl.classList.add('show'); $ovl.scrollTop=0;
  $ovlIn.querySelectorAll('#endLines p').forEach((p,i)=>
    setTimeout(()=>{p.classList.add('in');A.sfx(i===6?'confirm':'click')},500+i*620));
  el('endAgain').onclick=()=>{A.sfx('confirm');closeOvl();startNew()};
  el('endBoard').onclick=()=>{A.sfx('click');boardCard()};
  el('endTitle').onclick=()=>{A.sfx('cancel');closeOvl();toTitle()};
  try{ localStorage.removeItem(SAVE_KEY) }catch(e){}
  checkSave();
}

/* ═══ 輸入 ═══ */
const keys={};
addEventListener('keydown',e=>{
  const tag=(e.target&&e.target.tagName)||'';
  if(tag==='INPUT'||tag==='TEXTAREA') return;
  const k=e.key.toLowerCase();
  if(['arrowup','arrowdown','arrowleft','arrowright',' ','w','a','s','d','enter'].includes(k)) e.preventDefault();
  keys[k]=true;
  if(k===' '||k==='enter') interact();
});
addEventListener('keyup',e=>{ keys[e.key.toLowerCase()]=false });
$stage.addEventListener('pointerdown',()=>{
  A.resume();
  if($talk.classList.contains('show')&&!$ovl.classList.contains('show')) advanceTalk();
});
document.querySelectorAll('.pad button[data-d]').forEach(b=>{
  const d=b.dataset.d;
  const on=e=>{e.preventDefault(); if(d==='act'){A.sfx('click');interact()} else keys['pad_'+d]=true};
  const off=e=>{e.preventDefault(); keys['pad_'+d]=false};
  b.addEventListener('pointerdown',on); b.addEventListener('pointerup',off);
  b.addEventListener('pointerleave',off); b.addEventListener('pointercancel',off);
});
const IS_TOUCH=matchMedia('(pointer:coarse)').matches;
const $pad=el('pad');
function syncPad(){
  if(!IS_TOUCH){ $pad.classList.remove('show'); return }
  const ok=(Game.scene==='city'||Game.scene==='office')
    && !Game.duel && !$ovl.classList.contains('show') && !$talk.classList.contains('show');
  $pad.classList.toggle('show',ok);
}

/* ═══ 移動 ═══ */
function move(dt){
  if(Game.scene!=='city'&&Game.scene!=='office') return;
  if($ovl.classList.contains('show')||$talk.classList.contains('show')) return;
  let dx=0,dy=0;
  if(keys['arrowleft']||keys['a']||keys['pad_left']) dx-=1;
  if(keys['arrowright']||keys['d']||keys['pad_right']) dx+=1;
  if(keys['arrowup']||keys['w']||keys['pad_up']) dy-=1;
  if(keys['arrowdown']||keys['s']||keys['pad_down']) dy+=1;
  if(dx&&dy){ dx*=0.707; dy*=0.707 }
  if(!dx&&!dy){ P.walkT=0; P.frame=0; return }
  P.dir = dy<0?0 : dy>0?2 : dx>0?1 : 3;
  const sp=1.7*dt;
  const solid = Game.scene==='city' ? (a,b)=>World.solid(a,b) : (a,b)=>officeSolid(a,b);
  const W=12,H=12,ofx=2,ofy=3;
  const tryMove=(ax,ay)=>{
    const nx=P.x+ax, ny=P.y+ay;
    const x0=Math.floor((nx+ofx)/TS), x1=Math.floor((nx+ofx+W-1)/TS);
    const y0=Math.floor((ny+ofy)/TS), y1=Math.floor((ny+ofy+H-1)/TS);
    for(let y=y0;y<=y1;y++) for(let x=x0;x<=x1;x++) if(solid(x,y)) return false;
    P.x=nx; P.y=ny; return true;
  };
  tryMove(dx*sp,0); tryMove(0,dy*sp);
  P.walkT+=dt; if(P.walkT>7){ P.walkT=0; P.frame^=1; P.stepT++; if(P.stepT%2===0) A.sfx('step') }
  if(Game.scene==='office'){
    const tx=Math.floor((P.x+8)/TS), ty=Math.floor((P.y+8)/TS);
    if(ty>=OFFICE.h-1&&(tx===9||tx===10)) toCity();
  }
}

/* ═══ 主迴圈 ═══ */
let last=performance.now();
function loop(now){
  const dt=Math.min(3,(now-last)/16.67); last=now;
  move(dt);
  if(Game.duel){
    drawDuel(now,Game.duel.kind);
  }else if(Game.scene==='title'){
    if(!World.tiles) World.gen('TITLE-DEMO');
    Cam.x=(now/45)%(MW*TS-VW);
    Cam.y=Math.max(0,Math.min(MH*TS-VH,(MH*TS-VH)/2+Math.sin(now/4200)*60));
    drawCity(now);
  }else if(Game.scene==='city'||Game.scene==='ending'){
    if(Game.scene==='city') camTo(P.x+8,P.y+8);
    drawCity(now);
    if(Game.scene==='city'){
      drawGuy(P.x-Cam.x,P.y-Cam.y,P.dir,P.frame,null);
      drawNavArrow(); drawMinimap(); hintPrompt();
    }
  }else if(Game.scene==='office'){
    drawOffice(now);
    drawGuy(offGX()+P.x,offGY()+P.y,P.dir,P.frame,null);
  }
  syncPad();
  if(Game.dayOver && !Game.duel && !$ovl.classList.contains('show') && !$talk.classList.contains('show')
     && (Game.scene==='city'||Game.scene==='office')){
    Game.dayOver=false; endDay('行動點數用完了');
  }
  requestAnimationFrame(loop);
}

function hintPrompt(){
  const d=P.dir, tx=Math.floor((P.x+8)/TS)+(d===1?1:d===3?-1:0), ty=Math.floor((P.y+8)/TS)+(d===2?1:d===0?-1:0);
  const h=World.house(tx,ty); if(!h) return;
  let txt=null;
  if(h.office) txt='進入公司';
  else if(Game.nav&&Game.nav.id===h.id) txt='到了：'+(Game.nav.kind==='reg'?'戶籍地':Game.nav.kind==='meet'?'約訪地點':'線索地點');
  else if(h.sale){ const st=Game.hs(h.id); txt= st.signed?'已簽委託':st.seen?'再看一次謄本':'調閱電傳　−20 AP' }
  if(!txt) return;
  const sx=h.x*TS-Cam.x+8, sy=h.y*TS-Cam.y-22;
  cx.font='700 9px "Noto Sans TC",sans-serif'; cx.textAlign='center';
  const w=cx.measureText(txt).width+10;
  cx.fillStyle='rgba(8,12,17,.92)'; cx.fillRect(sx-w/2,sy-9,w,14);
  cx.fillStyle='#4b6280'; cx.fillRect(sx-w/2,sy-9,w,1); cx.fillRect(sx-w/2,sy+4,w,1);
  cx.fillStyle='#f6b23c'; cx.fillText(txt,sx,sy+1);
  cx.textAlign='left';
}

/* ═══ 啟動 ═══ */
el('mNew').onclick=()=>{A.resume();A.sfx('confirm');startNew()};
el('mBoard').onclick=()=>{A.resume();A.sfx('click');boardCard()};
el('mCredits').onclick=()=>{A.resume();A.sfx('click');
  card('製作人員','CREDITS',
   `<div style="font-family:var(--f-body);font-size:15px;line-height:2;text-align:center">
      企劃・製作
      <span style="font-family:var(--f-disp);font-weight:900;font-size:20px;letter-spacing:.1em;color:var(--amber);display:block;margin:4px 0">日勝國際不動產　Ryan 吳松儒</span>
      <div style="color:var(--dim);font-size:13px;line-height:1.9;margin-top:10px">
        遊戲內所有地址、街名、人名、建號皆為虛構<br>與現實世界之地址無關<br>
        本作獻給每一個還在跑街的房仲</div>
    </div>`,
   [{key:'✕',label:'返回',fn:()=>{A.sfx('cancel');closeOvl()}}]);
};
el('mLoad').onclick=()=>{
  const s=loadSave(); if(!s) return;
  A.resume(); A.sfx('confirm');
  Game.reset(s.seed,s.name); World.gen(s.seed);
  Game.day=s.day; Game.ap=s.ap; Game.signed=s.signed;
  Game.hstate=s.hstate||{}; Game.letters=s.letters||[]; Game.nav=s.nav||null; Game.logs=s.logs||[];
  $title.style.display='none'; $hud.classList.remove('hidden'); hudSync(); fitStage();
  if(s.scene==='office'){ Game.scene='office'; P.x=9.5*TS; P.y=(OFFICE.h-3)*TS; A.play('office') }
  else { Game.scene='city'; P.x=s.px; P.y=s.py; A.play('city') }
  P.dir=2; setActs(); toast('讀取完成　DAY '+Game.day);
};
el('bLog').onclick=()=>{A.sfx('click');logCard()};
el('bSave').onclick=()=>{
  if(!Game.duel&&(Game.scene==='city'||Game.scene==='office')) save(false);
  else toast('現在不能存檔');
};
el('bQuit').onclick=()=>{
  A.sfx('click');
  ask('回到主畫面？','沒有存檔的進度會消失。要先存檔的話請按取消，改按上面的「存檔」。',()=>{A.sfx('cancel');toTitle()});
};
el('bAudio').onclick=function(){
  A.on=!A.on; this.textContent=A.on?'♪ ON':'♪ OFF'; this.classList.toggle('on',A.on);
  if(A.on){ A.resume(); const t=A.track; A.track=null; A.play(t||'title') }
};

fitStage(); setTimeout(fitStage,80); setTimeout(fitStage,400);
checkSave();
AI.init();
requestAnimationFrame(loop);
</script>
